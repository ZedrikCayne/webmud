<html>
<head>
    <title>webmud</title>
    <meta charset="utf-8"></meta>
    <meta name="HandheldFriendly" content="true"></meta>
    <meta name="MobileOptimized" content="320"></meta>
    <meta name="viewport" content="initial-scale=1.0, width=device-width, user-scalable=no"></meta>
    <style>
/* http://meyerweb.com/eric/tools/css/reset/ 
   v2.0 | 20110126
   License: none (public domain)
*/
html, body, div, span, applet, object, iframe,
h1, h2, h3, h4, h5, h6, p, blockquote, pre,
a, abbr, acronym, address, big, cite, code,
del, dfn, em, img, ins, kbd, q, s, samp,
small, strike, strong, sub, sup, tt, var,
b, u, i, center,
dl, dt, dd, ol, ul, li,
fieldset, form, label, legend,
table, caption, tbody, tfoot, thead, tr, th, td,
article, aside, canvas, details, embed, 
figure, figcaption, footer, header, hgroup, 
menu, nav, output, ruby, section, summary,
time, mark, audio, video {
	margin: 0;
	padding: 0;
	border: 0;
	font-size: 100%;
	font: inherit;
	vertical-align: baseline;
}
/* HTML5 display-role reset for older browsers */
article, aside, details, figcaption, figure, 
footer, header, hgroup, menu, nav, section {
	display: block;
}
body {
	line-height: 1;
}
ol, ul {
	list-style: none;
}
blockquote, q {
	quotes: none;
}
blockquote:before, blockquote:after,
q:before, q:after {
	content: '';
	content: none;
}
table {
	border-collapse: collapse;
	border-spacing: 0;
}
/* Reset Ends */

html {
    align: center;
    align-content: center;
    background-color: #606060;
}
body,body#wholeBody,code,textarea {
    margin: 0px auto;
    padding: 0px;
    display: flex;
    flex-direction: column;
    font-family: 'Courier New', monospace;
    max-width:1024px;
    line-height:1.3;
    font-size:18px;
    color:#E0E0E0;
    width: 100%;
    background-color:#000000;
    color: #E0E0E0;
    overflow: hidden;
    scrollbar-color: #404040 #808080;
    scrollbar-width: thin;
}
body {
    min-height: 100dvh;
    max-height: 100dvh;
}
.scroll {
    overflow-y: scroll;
}
/*Where the scroll happens*/
.top-screen-part {
    min-height: 80dvh;
    max-height: 80dvh;
}
/*Input area*/
.bottom-screen-part {
    min-height: 20dvh;
    max-height: 20dvh;
    display: flex;
    justify-content: flex-start;
    flex-direction: column;
}
.output-area {
    width: 95%;
    white-space: pre-wrap;
    word-wrap: break-word;
}
.input-area, .input-area:focus {
    width: 95%;
    min-width: 95%;
    height: 95%;
    min-height: 95%;
    outline: none; 
    white-space: pre-wrap;
    word-wrap: break-word;
}
.lowerpadded {
    padding-left: 2.5%;
    padding-right: 2.5%;
}
.input-area > div {
    float: left;
}
.statusbar {
    height: 1.5em;
    width: 95%;
    background-color: #707070;
    color: #000000;
    display: block;
    font-weight: bold;
}

</style>
</head>
<body id="wholeBody">
    <noscript>You're going to need javascript for any of this to work.</noscript>
    <div id="outputScrollDiv" class="top-screen-part scroll">
        <code class="output-area" id="outputDiv"></code>
    </div>
    <div class="bottom-screen-part">
        <div id="lebar" class="statusbar lowerpadded">
            DISCONNECTED
        </div>
        <div class="scroll">
            <div contenteditable="true" class="input-area lowerpadded" id="inputBox" type="text" autofocus></div>
        </div>
    </div>
    <script>
        let globalWebsocket = null;
        let oldTextToSend = null;

        inputBox.innerText = "";

        let maxBackscroll = 800;
        let maxInputCache = 100;
        let backScroll = [];
        let inputCache = [];
        let currentInputCacheIndex = 0;
        let currentLineCache = null;

        //Fill the backscroll so the text in the output window starts at the bottom.
        for( i = 0; i < maxBackscroll; ++i ) {
            backScroll.push( "\r\n" );
        }
        backScroll.push("Enter /help below for help.");

        function fillBackscroll() {
            let tempString = "";

            for( i = 0; i < backScroll.length; ++i ) {
                tempString += backScroll[i];
            }
            outputDiv.textContent = tempString;
            outputScrollDiv.scrollTop = outputDiv.scrollHeight;
        }

        fillBackscroll();

        function inputCacheUp() {
            if( inputCache.length < 1 ) return;
            if( currentInputCacheIndex == 0 ) {
                currentInputCacheIndex = 1;
                currentLineCache = inputBox.innerText;
            } else {
                currentInputCacheIndex++;
            }
            while( currentInputCacheIndex > inputCache.length ) {
                --currentInputCacheIndex;
            }
            inputBox.innerText = inputCache[ inputCache.length - currentInputCacheIndex ];
        }

        function inputCacheDown() {
            if( currentInputCacheIndex > 0 ) {
                --currentInputCacheIndex;
            }
            if( currentInputCacheIndex == 0 ) {
                if( currentLineCache !== null && currentLineCache !== undefined ) {
                    inputBox.innerText = currentLineCache;
                }
            } else {
                if( inputCache.length > 0 ) {
                    inputBox.innerText = inputCache[ inputCache.length - currentInputCacheIndex ];
                }
            }
        }

        function inputCacheReset() {
            currentCacheIndex = 0;
            currentLineCache = null;
        }

        //On any keypress...focus the input box
        wholeBody.addEventListener( "keydown", function (event) {
	    switch( event.key ) {
            case "ArrowUp":
                //back one
                inputCacheUp();
                break;
            case "ArrowDown":
                inputCacheDown();
                break;
            default:
                inputBox.focus();
                break;
            }
        } );

        inputBox.addEventListener( "touchstart", function (event) {
            inputBox.focus();
        } );

        inputBox.addEventListener( "keypress", function (event) {
            if( event.key == "Enter" ) {
                event.preventDefault();
                sendBox();
            } else {
                inputCacheReset();
            }
        });

        function messageEvent( event ) {
            if( event.data instanceof Blob) {
                try {
                    event.data.text().then( function(val) { lebar.innerText = val } );
                } catch (error) {
                    console.error("Error on blob.",error);
                }
            } else {
                if( backScroll.length > maxBackscroll ) backScroll.shift();
                backScroll.push( event.data );
                fillBackscroll();
            }
        }

        function openEvent( event ) {
            if( oldTextToSend != null ) sendText( oldTextToSend );
            oldTextToSend = null;
        }

        function closeEvent( event ) {
            closeWebsocket();
        }

        function sendBox() {
            let handled = false;
            if( inputBox.innerText[0] == '/' ) {
                if( inputBox.innerText.startsWith( "/help" ) ) {
                    handled = true;
                    window.open("/help.html", "_blank");
                }
                if( inputBox.innerText.startsWith( "/logout" ) ||
                    inputBox.innerText.startsWith( "/logoff" ) ) {
                    handled = true;
                    window.location.replace("/logout");
                }
            } 
            if( !handled ) sendText( inputBox.innerText );
            inputBox.innerText = "";
        }

        function startWebsocket() {
            if( globalWebsocket === null ) {
                globalWebsocket = new WebSocket("/ws");
                globalWebsocket.addEventListener( "message", messageEvent );
                globalWebsocket.addEventListener( "open", openEvent );
                globalWebsocket.addEventListener( "close", closeEvent );
            } 
        }

        function sendText( theText ) {
            if( globalWebsocket == null ) startWebsocket();
            if( inputCache.length > maxBackscroll ) inputCache.shift();
            inputCache.push( theText );
            globalWebsocket.send( theText + "\r\n" );
        }

        function closeWebsocket() {
            if( globalWebsocket !== null ) {
                globalWebsocket.close();
                globalWebsocket = null;
            }
        }

        window.onload = startWebsocket;
    </script>
</body>
































































</html>
