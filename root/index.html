<html>
<head>
    <title>webmud</title>
    <meta charset="utf-8"></meta>
    <style>
/* http://meyerweb.com/eric/tools/css/reset/ 
   v2.0 | 20110126
   License: none (public domain)
*/
html, body, div, span, applet, object, iframe,
h1, h2, h3, h4, h5, h6, p, blockquote, pre,
a, abbr, acronym, address, big, cite, code,
del, dfn, em, img, ins, kbd, q, s, samp,
small, strike, strong, sub, sup, tt, var,
b, u, i, center,
dl, dt, dd, ol, ul, li,
fieldset, form, label, legend,
table, caption, tbody, tfoot, thead, tr, th, td,
article, aside, canvas, details, embed, 
figure, figcaption, footer, header, hgroup, 
menu, nav, output, ruby, section, summary,
time, mark, audio, video {
	margin: 0;
	padding: 0;
	border: 0;
	font-size: 100%;
	font: inherit;
	vertical-align: baseline;
}
/* HTML5 display-role reset for older browsers */
article, aside, details, figcaption, figure, 
footer, header, hgroup, menu, nav, section {
	display: block;
}
body {
	line-height: 1;
}
ol, ul {
	list-style: none;
}
blockquote, q {
	quotes: none;
}
blockquote:before, blockquote:after,
q:before, q:after {
	content: '';
	content: none;
}
table {
	border-collapse: collapse;
	border-spacing: 0;
}
/* Reset Ends */

html {
    align: center;
    align-content: center;
    background-color: #606060;
}
body,code,textarea {
    margin: 0px auto;
    padding: 0px;
    display: flex;
    flex-direction: column;
    font-family: 'Courier New', monospace;
    max-width:1024px;
    line-height:1.3;
    font-size:18px;
    color:#E0E0E0;
    width: 100%;
    background-color:#000000;
    color: #E0E0E0;
    overflow: hidden;
    scrollbar-color: #404040 #808080;
    scrollbar-width: thin;
}
body {
    min-height: 100vh;
    max-height: 100vh;
}
.scroll {
    overflow-y: scroll;
}
/*Where the scroll happens*/
.top-screen-part {
    min-height: 80vh;
    max-height: 80vh;
}
/*Input area*/
.bottom-screen-part {
    content: center;
    min-height: 20vh;
    max-height: 20vh;
}
.output-area {
    width: 95%;
    white-space: pre-wrap;
    word-wrap: break-word;
}
.input-area, .input-area:focus {
    width: 95%;
    outline:none;
    white-space: pre-wrap;
    word-wrap: break-word;
}

</style>
</head>
<body id="wholeBody">
    <div id="outputScrollDiv" class="top-screen-part scroll">
    <code class="output-area" id="outputDiv"></code>
    </div>
    <div class="bottom-screen-part scroll">
    <div contenteditable="true" class="input-area" id="inputBox" type="text" autofocus></textarea><br></br>
    </div>
    <script>
        let globalWebsocket = null;
        let oldTextToSend = null;

        //On any keypress...focus the input box.
        wholeBody.addEventListener( "keydown", function (event) {
            console.log("out: " +event);
            inputBox.focus();
        } );

        inputBox.addEventListener( "keypress", function (event) {
            console.log("in: " +event);
            if( event.key == "Enter" ) {
                event.preventDefault();
                sendBox();
            }
        });

        let maxBackscroll = 800;
        let maxInputCache = 100;
        let backScroll = [];
        let inputCache = [];
        let currentInputCacheIndex = 0;

        function messageEvent( event ) {
            console.log(event);
            if( backScroll.length > maxBackscroll ) backScroll.shift();
            backScroll.push( event.data );

            let tempString = "";

            for( i = 0; i < backScroll.length; ++i ) {
                tempString += backScroll[i];
            }
            outputDiv.textContent = tempString;
            outputScrollDiv.scrollTop = outputDiv.scrollHeight;
        }

        function openEvent( event ) {
            if( oldTextToSend != null ) sendText( oldTextToSend );
            oldTextToSend = null;
        }

        function closeEvent( event ) {
            console.log( event );
            closeWebsocket();
        }

        function sendBox() {
            let handled = false;
            if( inputBox.innerText[0] == '/' ) {
                if( inputBox.innerText.startsWith( "/help" ) ) {
                    handled = true;
                    window.open("/help.html", "_blank");
                }
            } 
            if( !handled ) sendText( inputBox.innerText );
            inputBox.innerText = "";
        }

        function startWebsocket() {
            if( globalWebsocket === null ) {
                globalWebsocket = new WebSocket("/ws");
                globalWebsocket.addEventListener( "message", messageEvent );
                globalWebsocket.addEventListener( "open", openEvent );
                globalWebsocket.addEventListener( "close", closeEvent );
            } 
        }

        function sendText( theText ) {
            if( globalWebsocket == null ) startWebsocket();
            globalWebsocket.send( theText + "\r\n" );
        }

        function closeWebsocket() {
            if( globalWebsocket !== null ) {
                globalWebsocket.close();
                globalWebsocket = null;
            }
        }

        document.onload = startWebsocket;
        window.onload = startWebsocket;
    </script>
</body>
</html>
