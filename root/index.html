<html>
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>webmud</title>
    <meta charset="utf-8"></meta>
    <meta name="HandheldFriendly" content="true"></meta>
    <meta name="MobileOptimized" content="320"></meta>
    <meta name="viewport" content="initial-scale=1.0, width=device-width, user-scalable=no"></meta>
    <style>
/* http://meyerweb.com/eric/tools/css/reset/ 
   v2.0 | 20110126
   License: none (public domain)
*/
html, body, div, span, applet, object, iframe,
h1, h2, h3, h4, h5, h6, p, blockquote, pre,
a, abbr, acronym, address, big, cite, code,
del, dfn, em, img, ins, kbd, q, s, samp,
small, strike, strong, sub, sup, tt, var,
b, u, i, center,
dl, dt, dd, ol, ul, li,
fieldset, form, label, legend,
table, caption, tbody, tfoot, thead, tr, th, td,
article, aside, canvas, details, embed, 
figure, figcaption, footer, header, hgroup, 
menu, nav, output, ruby, section, summary,
time, mark, audio, video {
	margin: 0;
	padding: 0;
	border: 0;
	font-size: 100%;
	font: inherit;
	vertical-align: baseline;
}
/* HTML5 display-role reset for older browsers */
article, aside, details, figcaption, figure, 
footer, header, hgroup, menu, nav, section {
	display: block;
}
body {
	line-height: 1;
}
ol, ul {
	list-style: none;
}
blockquote, q {
	quotes: none;
}
blockquote:before, blockquote:after,
q:before, q:after {
	content: '';
	content: none;
}
table {
	border-collapse: collapse;
	border-spacing: 0;
}
/* Reset Ends */

html {
    align: center;
    align-content: center;
    background-color: #606060;
}
body,body#wholeBody,code,textarea {
    margin: 0px auto;
    padding: 0px;
    display: flex;
    flex-direction: column;
    font-family: 'Courier New', monospace;
    max-width:1024px;
    line-height:1.3;
    font-size:18px;
    color:#E0E0E0;
    width: 100%;
    background-color:#000000;
    color: #E0E0E0;
    overflow: hidden;
    scrollbar-color: #404040 #808080;
    scrollbar-width: thin;
}
body {
    min-height: 100dvh;
    max-height: 100dvh;
}
.scroll {
    overflow-y: scroll;
}
/*Where the scroll happens*/
.top-screen-part {
    min-height: 80dvh;
    max-height: 80dvh;
}
/*Input area*/
.bottom-screen-part {
    min-height: 20dvh;
    max-height: 20dvh;
    display: flex;
    justify-content: flex-start;
    flex-direction: column;
}
.output-area {
    margin: auto;
    width: 95%;
    max-width: 95%;
    white-space: pre-wrap;
    word-wrap: break-word;
}
.input-area, .input-area:focus {
    width: calc(90% - 2em);
    min-width: calc(90% - 2em);
    height: 95%;
    min-height: 95%;
    outline: none; 
    white-space: pre-wrap;
    word-wrap: break-word;
}
.lowerpadded {
    padding-left: 2.5%;
    padding-right: 2.5%;
}
.input-area > div {
    float: left;
}
.statusbar {
    height: 1.5em;
    width: 95%;
    background-color: #707070;
    color: #000000;
    display: block;
    font-weight: bold;
}

.topright {
    position: absolute;
    top: 1.5em;
    right: 1em;
    width: 50px;
    height: 50px;
}

.bottomright {
    position: absolute;
    bottom: 0px;
    right: 1em;
    width: 50px;
    height: 50px;
}
a {
    color: #E0E0E0;
}
a:hover {
    color: #F0F0F0;
}
a:visited {
    color: #D8D8D8;
}
a:active {
    color: #FFFFFF;
}

</style>
</head>
<body id="wholeBody">
    <noscript>You're going to need javascript for any of this to work.</noscript>
    <div id="outputScrollDiv" class="top-screen-part scroll">
        <div class="output-area" id="outputDiv"></div>
    </div>
    <div style="position: relative" class="bottom-screen-part">
        <div id="lebar" class="statusbar lowerpadded">
            DISCONNECTED
        </div>
        <div style="z-index: 50" class="scroll">
            <div contenteditable="true" class="input-area lowerpadded" id="inputBox" type="text" autofocus></div>
        </div>
        <div id="upbutton" class="topright" onclick="inputCacheUp()">
        <svg width="50" height="50" xmlns="http://www.w3.org/2000/svg">
   <path d="M5 45 L25 5 L45 45 L5 45" style="fill:#E0E0E0;stroke:#000000;stroke-width:5" stroke-linecap="round" />
</svg></div>
        <div id="downbutton" class="bottomright" onclick="inputCacheDown()">
        <svg width="50" height="50" xmlns="http://www.w3.org/2000/svg">
   <path d="M5 5 L25 45 L45 5 L5 5" style="fill:#E0E0E0;stroke:#000000;stroke-width:5" stroke-linecap="round" />
</svg> </div>
    </div>
    <script>
        let globalWebsocket = null;
        let oldTextToSend = null;

        inputBox.innerText = "";

        let maxBackscroll = 800;
        let maxInputCache = 100;
        let inputCache = [];
        let currentInputCacheIndex = 0;
        let currentLineCache = null;

        //Fill the backscroll so the text in the output window starts at the bottom.
        for( i = 0; i < maxBackscroll; ++i ) {
            addLine("\r\n");
        }
        addLine("Enter /help below for help.\r\n");

        function inputCacheUp() {
            if( inputCache.length < 1 ) return;
            if( currentInputCacheIndex == 0 ) {
                currentInputCacheIndex = 1;
                currentLineCache = inputBox.innerText;
            } else {
                currentInputCacheIndex++;
            }
            while( currentInputCacheIndex > inputCache.length ) {
                --currentInputCacheIndex;
            }
            inputBox.innerText = inputCache[ inputCache.length - currentInputCacheIndex ];
        }

        function inputCacheDown() {
            if( currentInputCacheIndex > 0 ) {
                --currentInputCacheIndex;
            }
            if( currentInputCacheIndex == 0 ) {
                if( currentLineCache !== null && currentLineCache !== undefined ) {
                    inputBox.innerText = currentLineCache;
                }
            } else {
                if( inputCache.length > 0 ) {
                    inputBox.innerText = inputCache[ inputCache.length - currentInputCacheIndex ];
                }
            }
        }

        function inputCacheReset() {
            currentCacheIndex = 0;
            currentLineCache = null;
        }

        //On any keypress...focus the input box
        wholeBody.addEventListener( "keydown", function (event) {
	    switch( event.key ) {
            case "ArrowUp":
                //back one
                inputCacheUp();
                break;
            case "ArrowDown":
                inputCacheDown();
                break;
            default:
                inputBox.focus();
                break;
            }
        } );

        inputBox.addEventListener( "touchstart", function (event) {
            inputBox.focus();
        } );

        inputBox.addEventListener( "keypress", function (event) {
            if( event.key == "Enter" ) {
                event.preventDefault();
                sendBox();
            } else {
                inputCacheReset();
            }
        });

        let statusTimeout = 5000;
        let statusTimeoutEvent = undefined;

        function setStatusMessage( text, slowDown ) {
            if( statusTimeoutEvent ) {
                clearTimeout(statusTimeoutEvent);
                statusTimeoutEvent = undefined;
            }
            if( slowDown ) statusTimeout *= 2; else statusTimeout = 5000;
            if( statusTimeout > 600000 ) statusTimeout = 600000;
            lebar.innerText = text;
            statusTimeoutEvent = setTimeout( sendText, statusTimeout, "/status" );
        }

        let scrollbackTimeout = 5000;

        var zeRegexes = {};
        console.log( zeRegexes );

        function addLine( text, skipRegex ) {
            let wantBottom = outputScrollDiv.scrollTop > (outputDiv.scrollHeight - (outputDiv.scrollHeight * (10.0 / 100.0)));
            let regexOption = "none";
            if( skipRegex === undefined ) {
                try {
                    if( zeRegexes ) {
                        let keys = Object.keys(zeRegexes);
                        keys.forEach( function (aKey) {
                            let val = zeRegexes[aKey];
                            if( text.match( val.actualRegex ) ) {
                                if( val.what == "gag" )
                                    regexOption = "gag";
                                if( val.what == "hilight" )
                                    if( regexOption != "gag" )
                                        regexOption = "hilight";
                            }
                        } );
                    }
                } catch (e) {};
            }
            if( regexOption != "gag" ) {
                let newElement = document.createElement("div");
                newElement.textContent = text;
                let convertedHTML = newElement.innerHTML;
                newElement.innerHTML = convertedHTML.replace(/(https?:\/\/[-A-Za-z0-9-._~:/?#\[\]@!$&'\(\)*+,;=%]+)/g, (url) => { return `<a href="${url}" target="_blank">${url}</a>`; });
                if ( regexOption == "hilight" ) {
                    newElement.style = "font-weight:bold";
                }
                
                outputDiv.appendChild( newElement );
                if( outputDiv.childElementCount > maxBackscroll )
                    outputDiv.removeChild( outputDiv.firstChild );
                    
                if( wantBottom ) outputScrollDiv.scrollTop = outputDiv.scrollHeight;
            }
        }

        function handleBinaryMessage( text ) {
            var obj = null;
            try {
                obj = JSON.parse( text );
            } catch (ex) {
                console.log(ex);
            }
            if( obj !== null ) {
                if( obj.status ) { setStatusMessage( obj.status ); }
                if( obj.text ){ addLine( obj.text );}
            }
        }

        function messageEvent( event ) {
            if( event.data instanceof Blob) {
                try {
                    event.data.text().then( handleBinaryMessage );
                } catch (error) {
                    console.error("Error on blob.",error);
                }
            } else {
                addLine( event.data );
            }
        }

        function openEvent( event ) {
            setStatusMessage("webmud connected.",true);
            if( oldTextToSend != null ) sendText( oldTextToSend );
            oldTextToSend = null;
        }

        function closeEvent( event ) {
            closeWebsocket();
        }

        function sendBox() {
            let handled = false;
            if( inputBox.innerText[0] == '/' ) {
                if( inputBox.innerText.startsWith( "/help" ) ) {
                    handled = true;
                    window.open("/help.html", "_blank");
                }
                if( inputBox.innerText.startsWith( "/logout" ) ||
                    inputBox.innerText.startsWith( "/logoff" ) ) {
                    handled = true;
                    window.location.replace("/logout");
                }
                if( inputBox.innerText.startsWith( "/gag" ) ) {
                    handled = true;
                    let splits = inputBox.innerText.split(" ");
                    if( splits.length > 2 ) {
                        let newRegex = {};
                        newRegex.name = splits[1];
                        newRegex.reg = splits[2].trim();
                        newRegex.what = "gag";
                        newRegex.actualRegex = new RegExp(splits[2].trim());
                        zeRegexes[splits[1]] = newRegex;
                    } else {
                        setStatusMessage("Command is /gag <name> <regex>");
                    }
                }
                if( inputBox.innerText.startsWith( "/hilite" ) ||
                    inputBox.innerText.startsWith( "/hilight" ) ) {
                    handled = true;
                    let splits = inputBox.innerText.split(" ");
                    if( splits.length > 2 ) {
                        let newRegex = {};
                        newRegex.name = splits[1];
                        newRegex.reg = splits[2].trim();
                        newRegex.what = "hilight";
                        newRegex.actualRegex = new RegExp(splits[2].trim());
                        zeRegexes[splits[1]] = newRegex;
                    } else {
                        setStatusMessage("Command is /hilight <name> <regex>");
                    }
                }
                if( inputBox.innerText.startsWith("/list") ) {
                    handled = true;
                    if( zeRegexes ) {
                        let keys = Object.keys(zeRegexes);
                        if( keys.length == 0 ) {
                            addLine("No highlight or gag definitions.\r\n");
                        } else {
                            addLine("Highlight and gag definition start\r\n", true);
                            keys.forEach( function (aKey) {
                                let val = zeRegexes[aKey];
                                addLine( "/" + val.what + " " + val.name + " " + val.reg + "\r\n", true );
                            } );
                            addLine("Highlight and gag definition end\r\n", true);
                        }
                    }
                }
                if( inputBox.innerText.startsWith("/del") ) {
                    let splits = inputBox.innerText.split(" ");
                    handled = true;
                    if( splits.length > 1 ) {
                        let whatToDel = splits[1].trim();
                        try { delete zeRegexes[whatToDel]; } catch (e) {};
                    }
                }
            } 
            if( !handled ) sendText( inputBox.innerText );
            inputBox.innerText = "";
        }

        function startWebsocket() {
            if( globalWebsocket === null ) {
                try {
                    globalWebsocket = new WebSocket("/ws");
                    globalWebsocket.addEventListener( "message", messageEvent );
                    globalWebsocket.addEventListener( "open", openEvent );
                    globalWebsocket.addEventListener( "close", closeEvent );
                } catch (ex) {
                    closeWebsocket();
                }
            } 
        }

        function sendText( theText ) {
            if( globalWebsocket == null ) startWebsocket();
            if( inputCache.length > maxBackscroll ) inputCache.shift();
            inputCache.push( theText );
            try {
                globalWebsocket.send( theText + "\r\n" );
            } catch ( ex ) {
                setStatusMessage("Websocket failed to send.", true);
            }
        }

        function closeWebsocket() {
            setStatusMessage("Connection to webmud lost. Attempting reconnect.", true);
            if( globalWebsocket !== null ) {
                globalWebsocket.close();
                globalWebsocket = null;
            }
        }

        window.onload = function () {
            startWebsocket();
            outputScrollDiv.scrollTop = outputDiv.scrollHeight;
        }
    </script>
</body>
</html>
