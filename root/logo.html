<html>
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>logo</title>
    <meta charset="utf-8"></meta>
    <meta name="HandheldFriendly" content="true"></meta>
    <meta name="MobileOptimized" content="320"></meta>
    <meta name="viewport" content="initial-scale=1.0, width=device-width, user-scalable=no"></meta>
    <style>
/* http://meyerweb.com/eric/tools/css/reset/ 
   v2.0 | 20110126
   License: none (public domain)
*/
html, body, div, span, applet, object, iframe,
h1, h2, h3, h4, h5, h6, p, blockquote, pre,
a, abbr, acronym, address, big, cite, code,
del, dfn, em, img, ins, kbd, q, s, samp,
small, strike, strong, sub, sup, tt, var,
b, u, i, center,
dl, dt, dd, ol, ul, li,
fieldset, form, label, legend,
table, caption, tbody, tfoot, thead, tr, th, td,
article, aside, canvas, details, embed, 
figure, figcaption, footer, header, hgroup, 
menu, nav, output, ruby, section, summary,
time, mark, audio, video {
	margin: 0;
	padding: 0;
	border: 0;
	font-size: 100%;
	font: inherit;
	vertical-align: baseline;
}
/* HTML5 display-role reset for older browsers */
article, aside, details, figcaption, figure, 
footer, header, hgroup, menu, nav, section {
	display: block;
}
body {
	line-height: 1;
}
ol, ul {
	list-style: none;
}
blockquote, q {
	quotes: none;
}
blockquote:before, blockquote:after,
q:before, q:after {
	content: '';
	content: none;
}
table {
	border-collapse: collapse;
	border-spacing: 0;
}
/* Reset Ends */

html {
    align: center;
    align-content: center;
    background-color: #606060;
}
body,body#wholeBody,code,textarea {
    margin: 0px auto;
    padding: 0px;
    display: flex;
    flex-direction: column;
    font-family: 'Courier New', monospace;
    max-width:1024px;
    line-height:1.3;
    font-size:18px;
    color:#E0E0E0;
    width: 100%;
    background-color:#000000;
    color: #E0E0E0;
    overflow: hidden;
    scrollbar-color: #404040 #808080;
    scrollbar-width: thin;
}
body {
    min-height: 100dvh;
    max-height: 100dvh;
}
.scroll {
    overflow-y: scroll;
}
/*Where the scroll happens*/
.top-screen-part {
    min-height: 80dvh;
    max-height: 80dvh;
}
/*Input area*/
.bottom-screen-part {
    min-height: 20dvh;
    max-height: 20dvh;
    display: flex;
    justify-content: flex-start;
    flex-direction: column;
}
.output-area {
    margin: auto;
    width: 95%;
    max-width: 95%;
    white-space: pre-wrap;
    word-wrap: break-word;
}
.input-area, .input-area:focus {
    width: calc(90% - 2em);
    min-width: calc(90% - 2em);
    height: 95%;
    min-height: 95%;
    outline: none; 
    white-space: pre-wrap;
    word-wrap: break-word;
}
.lowerpadded {
    padding-left: 2.5%;
    padding-right: 2.5%;
}
.input-area > div {
    float: left;
}
.statusbar {
    height: 1.5em;
    width: 95%;
    background-color: #707070;
    color: #000000;
    display: block;
    font-weight: bold;
}

.topright {
    position: absolute;
    top: 1.5em;
    right: 1em;
    width: 50px;
    height: 50px;
}

.bottomright {
    position: absolute;
    bottom: 0px;
    right: 1em;
    width: 50px;
    height: 50px;
}
a {
    color: #E0E0E0;
}
a:hover {
    color: #F0F0F0;
}
a:visited {
    color: #D8D8D8;
}
a:active {
    color: #FFFFFF;
}
.help {
    font-family: 'Arial', sans-serif;
    font-size: 16;
    margin: 20;
    position: absolute;
    display: block;
    color: #F0F0F0;
}
td {
}
.hidden {
    display: none;
}

</style>
</head>
<body id="wholeBody">
    <noscript>You're going to need javascript for any of this to work.</noscript>
    <div id="thehelp" class="hidden top-screen-part help scroll">
    </div>
    <div id="outputDiv" class="top-screen-part" style="margin:auto;align-content:center">
    </div>
    <div style="max-width:1;max-height:1;position:absolute;top=0;left=0;overflow:hidden" id="screenReaderElement" aria-live="polite"></div>
    <div style="position: relative" class="bottom-screen-part">
        <div id="lebar" class="statusbar lowerpadded">
            Welcome to logo. Type 'help' to get the help.
        </div>
        <div style="z-index: 50" class="scroll">
            <div contenteditable="true" class="input-area lowerpadded" id="inputBox" type="text" autofocus></div>
        </div>
        <div id="upbutton" class="topright" onclick="inputCacheUp()">
        <svg width="50" height="50" xmlns="http://www.w3.org/2000/svg">
   <path d="M5 45 L25 5 L45 45 L5 45" style="fill:#E0E0E0;stroke:#000000;stroke-width:5" stroke-linecap="round" />
</svg></div>
        <div id="downbutton" class="bottomright" onclick="inputCacheDown()">
        <svg width="50" height="50" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 5 L25 45 L45 5 L5 5" style="fill:#E0E0E0;stroke:#000000;stroke-width:5" stroke-linecap="round" />
</svg> </div>
    </div>
    <script>
        inputBox.innerText = "";

        var undoStack = [];
        var inputCache = [];
        var currentLineCache = null;
        var currentInputCacheIndex = 0;

        var commandAccumulatorName = null;
        var commandAccumulator = null;
        var commandVariables = null;
        
        function inputCacheUp() {
            if( inputCache.length < 1 ) return;
            if( currentInputCacheIndex == 0 ) {
                currentInputCacheIndex = 1;
                currentLineCache = inputBox.innerText;
            } else {
                currentInputCacheIndex++;
            }
            while( currentInputCacheIndex > inputCache.length ) {
                --currentInputCacheIndex;
            }
            inputBox.innerText = inputCache[ inputCache.length - currentInputCacheIndex ];
        }

        function inputCacheDown() {
            if( currentInputCacheIndex > 0 ) {
                --currentInputCacheIndex;
            }
            if( currentInputCacheIndex == 0 ) {
                if( currentLineCache !== null && currentLineCache !== undefined ) {
                    inputBox.innerText = currentLineCache;
                }
            } else {
                if( inputCache.length > 0 ) {
                    inputBox.innerText = inputCache[ inputCache.length - currentInputCacheIndex ];
                }
            }
        }

        function inputCacheReset() {
            currentInputCacheIndex = 0;
            currentLineCache = null;
        }

        //On any keypress...focus the input box
        wholeBody.addEventListener( "keydown", function (event) {
	    switch( event.key ) {
            case "ArrowUp":
                //back one
                inputCacheUp();
                break;
            case "ArrowDown":
                inputCacheDown();
                break;
            default:
                inputBox.focus();
                break;
            }
        } );

        inputBox.addEventListener( "touchstart", function (event) {
            inputBox.focus();
        } );

        inputBox.addEventListener( "keypress", function (event) {
            if( event.key == "Enter" ) {
                event.preventDefault();
                sendInputBox();
            } else {
                inputCacheReset();
            }
        });

        var clearStatusTimeout = undefined;
        function clearStatus() {
            if( clearStatusTimeout ) {
                clearTimeout( clearStatusTimeout );
            }

            clearStatusTimeout = undefined;
            lebar.innerText = "Welcome to logo. Enter 'help' for help.";
        }
        function setStatusMessage( text ) {
            if( clearStatusTimeout ) {
                clearTimeout( clearStatusTimeout );
            }
            setTimeout( clearStatus, 5000 );
            
            lebar.innerText = text;
        }

        let scrollbackTimeout = 5000;

        function deleteLineFromAria() {
            try {
                if( screenReaderElement.firstChild )
                    screenReaderElement.removeChild( screenReaderElement.firstChild );
            }catch(e) {};
            setTimeout( deleteLineFromAria, scrollbackTimeout );
        }

        function sendInputBox() {
            let handled = false;
            let newElement = document.createElement("div");
            newElement.textContent = inputBox.innerText;
            screenReaderElement.appendChild( newElement );
            let allInputText = inputBox.innerText;
            let splitText = allInputText.split("\n");
            let len = splitText.length;
            for( let i = 0; i < len; ++i ) {
                if( !processCommand( splitText[i] ) ) {
                    break;
                }
            }
            pushForUndo();
        }

        function clearInputBox() {
            inputBox.innerText = "";
        }

        var verboseApply = false;
        var globalDefinedCommands = {};
        var globalSvgEditable;
        var turtle = null;
        var imageSpace = {"width":0,"height":0};
        var rootTurtleState = {"width":0,"height":0,"x":0,
            "y":0,"rot":0,"pen":true,"pencolor":"#ffffff",
            "fill":"none","penwidth":1,
            "lastpathoperation":0,"accumulator":"","svg":"",
            "definedCommands":{},
            "globalVariables":{":PI":3.141592654,":E":2.718281828459},
            "currentMath":0.0,
            "outputVariable":null,
            "variableStack":[]
        };



        try {
            globalDefinedCommands = JSON.parse(localStorage.getItem("savedCommands"));
        } catch (e) {
            globalDefinedCommands = {};
        }

        if( !globalDefinedCommands ) globalDefinedCommands = {};

        function isAVariable( aString ) {
            if( aString === undefined ) return false;
            if( typeof aString != "string" ) return false;
            return aString.startsWith(":")
        }

        function parseNumberOrVariable( aString, turtleState ) {
            if( isAVariable( aString ) ) {
                return aString;
            }
            return Number(aString);
        }

        function handleNumberOrVariable( aThing, turtleState ) {
            if( typeof aThing == "number" ) {
                if( verboseApply )  console.log( "handleNumberOrVariable( " + aThing + " )" );
                return aThing;
            }
            if( isAVariable( aThing ) ) {
                if( turtleState.variableStack.length > 0 ) {
                    if( verboseApply )  console.log( "handleNumberOrVariable looking in the stack depth " + turtleState.variableStack.length );
                    for( i = turtleState.variableStack.length - 1; i >= 0; --i ) {
                        if( verboseApply )  console.log( "handleNumberOrVariable checking " + i );
                        if( turtleState.variableStack[i][ aThing ] !== undefined ) {
                            if( verboseApply )  console.log( "handleNumberOrVariable found " +  turtleState.variableStack[i][aThing] );
                            return turtleState.variableStack[i][aThing];
                        }
                    }
                }
                if( turtleState.globalVariables[ aThing ] !== undefined ) {
                    if( verboseApply )  console.log( "handleNumberOrVariable found global " + turtleState.globalVariables[aThing]  );
                    return turtleState.globalVariables[ aThing ];
                }
            }
            if( verboseApply )  console.log( "handleNumberOrVariable trying to make a number " + aThing  );
            return Number(aThing);
        }

        function pushVariableContext( turtleState ) {
            turtleState.variableStack.push( {} );
        }

        function popVariableContext( turtleState ) {
            turtleState.variableStack.pop();
        }

        function setVariable(aVariable, aValue, turtleState ) {
            if( !isAVariable( aVariable ) ) {
                return true;
            }
            if( turtleState.variableStack.length > 0 ) {
                turtleState.variableStack[turtleState.variableStack.length - 1][ aVariable ] = handleNumberOrVariable(aValue, turtleState);
            } else {
                turtleState.globalVariables[ aVariable ] = handleNumberOrVariable( aValue, turtleState );
            }
            return false;
        }

        var globalTurtleState = null;
        clearOutput();

        function clearUndo() {
            undoStack = [];
        }

        function pushForUndo() {
            console.log("Push");
            undoStack.push( structuredClone( globalTurtleState ) );
        }

        function popUndo() {
            console.log("Pop");
            setStatusMessage("Undo");
            undoStack.pop();
            globalTurtleState = undoStack.pop();
        }

        function clearOutput() {
            clearUndo();
            globalSvgEditable = null;
            outputDiv.innerHTML = "";
            globalTurtleState = structuredClone( rootTurtleState );
            globalTurtleState.definedCommands = globalDefinedCommands;
        }
        function svgStart(turtleState) {
            return '<svg width="' + turtleState.width + '" height="' + turtleState.height + '" xmlns="http://www.w3.org/2000/svg">';
        }
        function svgEnd() {
            return '</svg>';
        }
        function pathStart( turtleState ) {
            return '<path d="';
        }
        function pathEnd( turtleState ) {
            return (turtleState.fill=="none"
                    ?''
                    :(turtleState.lastpathoperation=='Z'?'':'Z')) +
                    '" style="stroke:' + turtleState.pencolor +
                    ';stroke-width:' + turtleState.penwidth + 
                    ';fill:' + turtleState.fill + '"/>';
        }

        function xyFromContext(x,y,turtleContext) {
            return {"x":Math.floor(Number(x)),"y":Math.floor(Number(turtleContext.height)-Number(y))};
        }

        function applyPathOp( op, x, y, turtleContext ) {
            lastOp = turtleContext.lastpathoperation;
            turtleContext.lastpathoperation = op;
            if( op != "M" ) {
                if( lastOp == "M" ) {
                    position = xyFromContext(turtleContext.x, turtleContext.y,turtleContext);
                    turtleContext.accumulator += "M" +
                        position.x + " " + position.y;
                }
                position = xyFromContext(x,y,turtleContext);
                turtleContext.accumulator += (lastOp!=op?op:" ") +
                    position.x + " " + position.y;
            }
            turtleContext.x = x;
            turtleContext.y = y;
            return true;
        }

        function privateMoveTo( x, y, turtleContext ) {
            if( turtleContext.pen ) {
                applyPathOp( "L", x, y, turtleContext );
            } else {
                applyPathOp( "M", x, y, turtleContext );
            }
            applyTurtle( turtleContext );
        }

        function parseMoveTo( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 3 ) {
                setStatusMessage("Command is 'moveto <x> <y>'");
                return -1;
            }
            let theX = parseNumberOrVariable(turtleCommand[1]);
            if( theX == NaN ) {
                setStatusMessage("moveto <x> <y>  X needs to be a number");
                return -1;
            }
            turtleCommand[1] = theX;
            let theY = parseNumberOrVariable(turtleCommand[2]);
            if( theY == NaN ) {
                setStatusMessage("moveto <x> <y>  Y needs to be a number");
                return -1;
            }
            turtleCommand[2] = theY;
            return 3;
        }

        function handleMoveTo( turtleCommand, turtleContext ) {
            privateMoveTo( handleNumberOrVariable(turtleCommand[1], turtleContext), handleNumberOrVariable(turtleCommand[2], turtleContext), turtleContext );
            return 3;
        }

        function parsePen( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage("Command is 'pen [up|down]'");
                return -1;
            }
            switch( turtleCommand[ 1 ] ) {
                case "up":
                    break;
                case "down":
                    break;
                default:
                    setStatusMessage("Command needs up or down. Was provided with " + sturtleCommand[1]);
                    return -1;
            }
            return 2;
        }

        function handlePen( turtleCommand, turtleContext ) {
            switch( turtleCommand[ 1 ] ) {
                case "up":
                    turtleContext.pen = false;
                    break;
                case "down":
                    turtleContext.pen = true;
                    break;
            }
            return 2;
        }

        function parseClear( turtleCommand, turtleState ) {
            return 1;
        }

        function handleClear( turtleCommand, turtleState ) {
            clearOutput();
            return 1;
        }

        function parseForward( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage("Command is 'forward <length>'");
                return -1;
            }
            let length = parseNumberOrVariable(turtleCommand[1]);
            if( length == NaN ) {
                setStatusMessage("Length must be a number");
                return -1;
            }
            turtleCommand[1] = length;
            return 2;
        }

        function handleForward( turtleCommand, turtleContext ) {
            let length = handleNumberOrVariable( turtleCommand[1], turtleContext );
            let aSin = Math.sin( turtleContext.rot * 3.141592654 / 180.0 );
            let aCos = Math.cos( turtleContext.rot * 3.141592654 / 180.0 );

            privateMoveTo( turtleContext.x + ( aSin * length ),
                turtleContext.y + ( aCos * length ), turtleContext );

            return 2;
        }

        function parseBack( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage("Command is 'back <length>'");
                return -1;
            }
            let length = parseNumberOrVariable(turtleCommand[1]);
            if( length == NaN ) {
                setStatusMessage("Length must be a number");
                return -1;
            }
            turtleCommand[1] = length;
            return 2;
        }
        function handleBack( turtleCommand, turtleContext ) {
            let length = handleNumberOrVariable( turtleCommand[1], turtleContext );
            let aSin = Math.sin( turtleContext.rot * 3.141592654 / 180.0 );
            let aCos = Math.cos( turtleContext.rot * 3.141592654 / 180.0 );

            privateMoveTo( turtleContext.x + ( aSin * length * -1 ),
                turtleContext.y + ( aCos * length * -1 ), turtleContext );

            return 2;
        }

        function parseTurn( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage("Command is 'turn <angle>'");
                return -1;
            }
            let rotVal = parseNumberOrVariable( turtleCommand[1] );
            if( rotVal == NaN ) {
                setStatusMessage("Angle must be a number");
                return -1;
            }
            turtleCommand[1] = rotVal;
            return 2;
        }
        function handleTurn( turtleCommand, turtleContext ) {
            rotVal = handleNumberOrVariable( turtleCommand[1], turtleContext );
            turtleContext.rot = (turtleContext.rot + rotVal) % 360.0;
            applyTurtle( turtleContext );
            return 2;
        }

        function parseTurnto( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage("Command is 'turnto <angle>'");
                return -1;
            }
            let rotVal = parseNumberOrVariable( turtleCommand[1] );
            if( rotVal == NaN ) {
                setStatusMessage("Angle must be a number");
                return -1;
            }
            turtleCommand[1] = rotVal;
            return 2;
        }
        function handleTurnto( turtleCommand, turtleContext ) {
            let rotVal = handleNumberOrVariable( turtleCommand[1], turtleContext );
            turtleContext.rot = (rotVal % 360.0);
            applyTurtle( turtleContext );
            return 2;
        }

        function parseRight( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage("Command is 'right <angle>'");
                return -1;
            }
            let rotVal = parseNumberOrVariable( turtleCommand[1] );
            if( rotVal == NaN ) {
                setStatusMessage("Angle must be a number");
                return -1;
            }
            turtleCommand[1] = rotVal;
            return 2;
        }

        function handleRight( turtleCommand, turtleContext ) {
            let rotVal = handleNumberOrVariable( turtleCommand[1], turtleContext );
            turtleContext.rot = ((turtleContext.rot + rotVal) % 360.0);
            applyTurtle( turtleContext );
            return 2;
        }
        function parseLeft( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage("Command is 'left <angle>'");
                return -1;
            }
            let rotVal = parseNumberOrVariable( turtleCommand[1] );
            if( rotVal == NaN ) {
                setStatusMessage("Angle must be a number");
                return -1;
            }
            turtleCommand[1] = rotVal;
            return 2;
        }
        function handleLeft( turtleCommand, turtleContext ) {
            let rotVal = handleNumberOrVariable( turtleCommand[1], turtleContext );
            turtleContext.rot = ((turtleContext.rot - rotVal) % 360.0);
            applyTurtle( turtleContext );
            return 2;
        }


        function openNewPath( turtleContext ) {
            turtleContext.accumulator += pathEnd( turtleContext ) + pathStart( turtleContext );
            turtleContext.lastpathoperation = "0";
            applyPathOp( "M", turtleContext.x, turtleContext.y, turtleContext );
        }

        function applyTurtle( turtleContext ) {
            turtleContext.svg = turtleContext.accumulator +
                pathEnd( turtleContext ) + svgEnd();

            globalSvgEditable.innerHTML = turtleContext.svg;
            
            let xform = "translate( " + (Number(turtleContext.x) - Number(turtle.whmin/2)) + "px, " + (-1 * (Number(turtleContext.y) + Number(turtle.whmin))) + "px ) rotate( " + Number(turtleContext.rot) + "deg )";

            turtle.style.transform = xform;
        }

        function parseNew( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 3 ) {
                setStatusMessage( "Command is 'new <x> <y>'" );
                return -1;
            }
            var x = Number(turtleCommand[1]);
            if( x == NaN ) {
                setStatusCommand( "new <x> <y> X must be a number." );
                return -1;
            }
            turtleCommand[1] = x;
            var y = Number(turtleCommand[2]);
            if( y == NaN ) {
                setStatusCommand( "new <x> <y> Y must be a number." );
                return -1;
            }
            turtleCommand[2] = y;
            return 3;
        }

        function handleNew( turtleCommand, turtleContext ) {
            var x = turtleCommand[1];
            var y = turtleCommand[2];
            clearOutput();
            turtleContext = globalTurtleState;
            setVariable(":WIDTH", turtleCommand[1], turtleContext);
            setVariable(":HEIGHT", turtleCommand[2], turtleContext);
            turtle = null;
            turtleContext.width = x;
            turtleContext.height = y;
            let svgDiv = document.createElement("div");
            svgDiv.style.width=turtleContext.width;
            svgDiv.style.height=turtleContext.height;
            svgDiv.style.position="relative";
            outputDiv.appendChild( svgDiv );
            let svgNonEditable = document.createElement("div");
            svgNonEditable.style="position:absolute;top:0;left:0";

            let innerHtmlString =   "<svg width=\"" + x + "\" " +
                                    "height=\"" + y + "\" " +
                                    "xmlns=\"http://www.w3.org/2000/svg\">" +
                                    "<path d=\"" + 
                                        "M 0 0 " + 
                                        "L " + x + " 0 " + 
                                        "L " + x + " " + y +
                                        "L 0 " + y +
                                        "Z\" " +
                                        "style=\"stroke:#FFFFFF;stroke-width:1;fill:none\"" +
                                        "/></svg>";
            let svgEditable = document.createElement("div");
            svgNonEditable.innerHTML = innerHtmlString;
            svgEditable.innerHTML = "";
            svgDiv.appendChild( svgNonEditable );
            svgDiv.appendChild( svgEditable );
            svgDiv.appendChild( grabTurtle(x,y) );
            outputDiv.appendChild( svgDiv );

            turtleContext.width = x;
            turtleContext.height = y;
            turtleContext.x = x/2;
            turtleContext.y = y/2;
            turtleContext.rot = 0;
            turtleContext.accumulator = svgStart( turtleContext ) + pathStart( turtleContext );
            //Put the first move in.
            applyPathOp( "M", turtleContext.x, turtleContext.y, turtleContext );

            globalSvgEditable = svgEditable;

            applyTurtle( turtleContext );

            return 3;
        }

        function parseFill( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage( "Command is 'fill <color>'" );
                return -1;
            }
            return 2;
        }
        
        function handleFill( turtleCommand, turtleContext ) {
            turtleContext.fill = turtleCommand[1];
            applyTurtle( turtleContext );
            return 2;
        }

        function parseColor( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage( "Command is 'color <color>'" );
                return -1;
            }
            return 2;
        }
        function handleColor( turtleCommand, turtleContext ) {
            turtleContext.pencolor = turtleCommand[1];
            applyTurtle( turtleContext );

            return 2;
        }
        
        function parseRepeat( turtleCommand, turtleState ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage( "Command is repeat <number>" );
                return -1;
            }
            var repeats = parseNumberOrVariable(turtleCommand[1]);
            if( repeats == NaN ) {
                setStatusMessage( "Command needs a number of times to repeat." );
                return -1;
            }
            turtleCommand[1] = repeats;
            return 2;
        }

        function handleRepeat( turtleCommand, turtleState ) {
            let repeats = handleNumberOrVariable( turtleCommand[1], turtleState );
            for( let rep = 0; rep < repeats; ++rep ) {
                let repeatMe = turtleCommand.slice(2);
                applyCommands( repeatMe, turtleState );
            }
            return turtleCommand.length;
        }

        function cancelAccumulation() {
            commandAccumulator = null;
            commandAccumulatorName = null;
            commandVariables = null;
        }

        function parseTo( turtleCommand, turtleState ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage( "Command is 'to <name> [var1] ...'" );
                return -1;
            }
            commandAccumulator = [];
            commandAccumulatorName = turtleCommand[1];
            if( turtleCommand.length > 2 ) {
                commandVariables = turtleCommand.slice(2);
            } else {
                commandVariables = [];
            }
            pushVariableContext(turtleState);
            
            return turtleCommand.length;
        }

        function handleTo( turtleCommand, turtleState ) {
            return turtleCommand.length;
        }
        
        function parseEnd( turtleCommand, turtleState ) {
            popVariableContext(turtleState);
            turtleState.definedCommands[ commandAccumulatorName ] = {};
            turtleState.definedCommands[ commandAccumulatorName ].vars = commandVariables;
            turtleState.definedCommands[ commandAccumulatorName ].commands = commandAccumulator;
            cancelAccumulation();
            localStorage.setItem("savedCommands", JSON.stringify(globalDefinedCommands) );
            return 1;
        }
        function handleEnd( turtleCommand, turtleState ) {
            return 1;
        }

        function parsePath( turtleCommand, turtleState ) {
            return 1;
        }
        function handlePath( turtleCommand, turtleState ) {

        }


        function parseUndo( turtleCommand, turtleState ) {
            return 1;
        }

        function getCommand( forThis ) {
            for( var i = 0; i < commands.length; ++i ) {
                if( forThis == commands[i].command ) {
                    return commands[i];
                }
            }
            return null;
        }

        var commands = [
            { "command":"moveto", "handler":handleMoveTo, "parser":parseMoveTo, "helpcommand":"moveto <x> <y>", "helpdesc":"Move the turtle to pixels x,y. 0,0 is the bottom left" },
            { "command":"pen", "handler":handlePen, "parser":parsePen, "helpcommand":"pen [up|down]", "helpdesc":"Take the pen off the paper, or put it down on the paper. Starts and stops drawing." },
            { "command":"forward", "handler":handleForward, "parser":parseForward, "helpcommand":"forward <length>", "helpdesc":"Move the turtle forward <length> pixels." },
            { "command":"turn", "handler":handleTurn, "parser":parseTurn, "helpcommand":"turn <degrees>", "helpdesc":"Turn the turtle clockwise <degrees> degrees." },
            { "command":"turnto", "handler":handleTurnto, "parser":parseTurnto, "helpcommand":"turnto <degrees>", "helpdesc":"Turn the turtle to an absolute number of degrees, where 0 points straight up." },
            { "command":"clear", "handler":handleClear, "parser":parseClear, "helpcommand":"clear", "helpdesc":"Clears the screen." },
            { "command":"new", "handler":handleNew, "parser":parseNew, "helpcommand":"new <width> <height>", "helpdesc":"Creates a new area to draw in widthxheight pixels." },
            { "command":"fill", "handler":handleFill, "parser": parseFill, "helpcommand":"fill <color>", "helpdesc":"Sets the fill color. Specified in web colors by name or using the various # values." },
            { "command":"color", "handler":handleColor, "parser": parseColor, "helpcommand":"color <color>", "helpdesc":"Change the 'stroke' or line color of the turtle. Will start a new path." },
            { "command":"repeat", "handler":handleRepeat, "parser": parseRepeat, "helpcommand":"repeate <num>", "helpdesc":"Repeats whatever is on the rest of the line <num> times. To make a square for example, you would 'repeat 4 forward 20 right 90'" },
            { "command":"to", "handler":handleTo, "parser":parseTo, "helpcommand":"to <name> <:var1> <:var2>", "helpdesc":"Create a new command called <name>. All commands entered until 'end' will be part of the new command. Variables are defined as :varname and will be pulled off the commands in order. For example 'to square :width :height' will define a command called square that will take two parameters" },
            { "command":"end", "handler":handleEnd, "parser":parseEnd, "helpcommand":"end", "helpdesc":"Used to end a command you started specifying with 'to'" },
            { "command":"path", "handler":handlePath, "parser":parsePath, "helpcommand":"path", "helpdesc":"Creates a new path. Internally this creates a 'svg' with paths. So if you need separate filled sections, you are going to want to create multiple paths." },
            { "command":"undo", "handler":handleUndo, "parser":parseUndo, "helpcommand":"undo", "helpdesc":"Undoes your last command." },
            { "command":"right", "handler":handleRight, "parser":parseRight, "helpcommand":"right <degrees>", "helpdesc":"Turns your turtle clockwise <degrees> degrees." },
            { "command":"left", "handler":handleLeft, "parser":parseLeft, "helpcommand":"left <degrees>", "helpdesc":"Turns your turtle counter-clockwise <degrees> degrees." },
            { "command":"back", "handler":handleBack, "parser":parseBack, "helpcommand":"back <length>", "helpdesc":"Moves your turtle backwards <length> pixels." },
            { "command":"hide", "handler":handleHide, "parser":parseHide, "helpcommand":"hide", "helpdesc":"Hides your turtle" },
            { "command":"show", "handler":handleShow, "parser":parseShow, "helpcommand":"show", "helpdesc":"Shows your turtle" },
            { "command":"+", "handler":handleAddition, "parser":parseAddition, "helpcommand":"+ <numberorvariable>", "helpdesc":"Math in this version of logo is weird. You can only assign calculated bits to variables, not use them directly. (ie: You cannot forward 5 + 6, but you can ':moveto = 5 + 6' then 'forward :moveto'" },
            { "command":"-", "handler":handleSubtraction, "parser":parseSubtraction, "helpcommand":"- <numberorvariable>", "helpdesc":"Subtraction." },
            { "command":"*", "handler":handleMultiply, "parser":parseMultiply, "helpcaommand":"* <numberorvariable>", "helpdesc":"Multiplication." },
            { "command":"/", "handler":handleDivide, "parser":parseDivide, "helpcommand":"/ <numberorvariable>", "helpdesc":"Division" },
            { "command":"=", "handler":handleAssign, "parser":parseAssign, "helpcommand":"= <numberorvariable>", "helpdesc":"Assignment" },
            { "command":"sin", "handler":handleSin, "parser":parseSin, "helpcommand":"sin", "helpdesc":"Put the sin value of the math done previous to it in the result. So ':sinangle = :angle / 360 * :PI sin' will take an angle in degrees, convert it to radians, and then take the sin value." },
            { "command":"cos", "handler":handleCos, "parser":parseCos, "helpcommand":"cos", "helpdesc":"Put the sin value of the math done previous to it in the result. So ':cosangle = :angle / 360 * :PI cos' will take an angle in degrees, convert it to radians, and then take the cos value." },
            { "command":"tan", "handler":handleTan, "parser":parseTan, "helpcommand":"cos", "helpdesc":"As per sin and cos, will put the tan of the accumulated math into the result." },
            { "command":"sqrt", "handler":handleSqrt, "parser":parseSqrt, "helpcommand":"sqrt", "helpdesc":"Takes the square root of the accumulated math so far." },
            { "command":"verboseapply", "handler":handleVerboseApply, "parser":parseVerboseApply, "helpcommand":"verboseapply", "helpdesc":"Turns on verbose logging of commands running in the console log of the browser."},
            { "command":"width", "handler":handleWidth, "parser":parseWidth, "helpcommand":"width <pixels>", "helpdesc":"Makes the stroke width of the line wider." },
            { "command":"save", "handler":handleSave, "parser":parseSave, "helpcommand":"save <filename>", "helpdesc":"Will download your art to the filename you provided." },
            { "command":"help", "handler":handleHelp, "parser":parseHelp, "helpcommand":"help", "helpdesc":"Brings up this help!" },
            { "command":"rand", "handler":handleRand, "parser":parseRand, "helpcommand":"rand", "helpdesc":"Overwites the current math value with a random number." },
            { "command":"export", "handler":handleExport, "parser":parseExport, "helpcommand":"export <filename>", "helpdesc":"Exports your custom commands to the filename you specify for download." }
        ];

        function fillHelp() {
            thehelp.innerHTML = "";
            let table = document.createElement("table");
            thehelp.appendChild(table);
            let tableRow = document.createElement("tr");
            table.appendChild(tableRow);
            let tableH = document.createElement("th");
            tableH.textContent = "Command";
            tableRow.appendChild(tableH);
            tableH = document.createElement("th");
            tableH.innerHTML = "<nbsp/>|<nbsp/>";
            tableRow.appendChild(tableH);
            tableH = document.createElement("th");
            tableH.textContent = "";
            tableRow.appendChild(tableH);
            for( let i = 0; i < commands.length; ++i ) {
                tableRow = document.createElement("tr");
                table.appendChild( tableRow );
                let tableD = document.createElement("td");
                tableD.textContent = commands[i].helpcommand;
                tableRow.appendChild(tableD);
                tableD = document.createElement("td");
                tableD.innerHTML = "<nbsp/>|<nbsp/>";
                tableRow.appendChild(tableD);
                tableD = document.createElement("td");
                tableD.textContent = commands[i].helpdesc;
                tableRow.appendChild(tableD);

        }

        function parseHelp( turtleCommand, turtleContext ) {
            return 1;

        function handleHelp( turtleCommand, turtleContext ) {
            thehelp.classList.toggle("hidden");

        function parseRand( turtleCommand, turtleContext ) {
            return 1;
        }
        function handleRand( turtleCommand, turtleContext ) {
            turtleContext.currentMath = Math.random();
            return 1;
        }

        function parseExport( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage("Command 'export <filename>' needs a file name.");
                return -1;
            }
            return 2;
        }
        function handleExport( turtleCommand, turtleContext ) {
            let output = "";
            let eachCommand = Object.values(turtleContext.definedCommands);
            let theLen = eachCommand.length;
            for( let i = 0; i < theLen; ++i ) {
                let theCommands = eachCommand[i].commands;
                let numCommands = theCommands.length;
                for( let j = 0; j < numCommands; ++j ) {
                    let tokens = theCommands[j];
                    let numTokens = tokens.length;
                    for( let k = 0; k < numTokens; ++k ) {
                        output += tokens[k];
                        if( k < numTokens - 1 ) output += " ";
                    }
                    output += "\r\n";
                }
                output += "end\r\n";
            }
            let b = new Blob([output], {type:"text/plain"});
            let url = URL.createObjectURL(b);
            let a = document.createElement("a");
            let filename = turtleCommand[1];
            if( !filename.endsWith(".logo") ) filename = filename + ".logo"
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            return 2;
        }

        function parseSave( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage("Command 'save <filename>' needs a file name.");
                return -1;
            }
            return 2;
        }
        function handleSave( turtleCommand, turtleContext ) {
            let b = new Blob([turtleContext.svg], {type:"image/svg+xml"});
            let url = URL.createObjectURL(b);
            let a = document.createElement("a");
            let filename = turtleCommand[1];
            if( !filename.endsWith(".svg") ) filename = filename + ".svg"
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
        function parseWidth( turtleCommand, turtleContext ) {
            if( turtleCommand.length < 2 ) {
                setStatusMessage("Command width <px> needs a parameter");
                return -1;
            }
            if( parseNumberOrVariable( turtleCommand[1] ) == NaN ) {
                setStatusMessage("Command 'width <px>' <px> needs to be a number.");
                return -1;
            }
            return 2;
        }
        function handleWidth( turtleCommand, turtleContext ) {
            turtleContext.penwidth = handleNumberOrVariable(turtleCommand[1], turtleContext);
            return 2;
        }
        function parseVerboseApply( turtleCommand, turtleContext ) {
            return 1;
        }
        function handleVerboseApply( turtleCommadn, turtleContext ) {
            verboseApply = !verboseApply;
            return 1;
        }

        function parseHide( turtleCommand, turtleContext ) {
            return 1;
        }

        function handleHide( turtleCommand, turtleContext ) {
            turtle.style.display = "none";
            return 1;
        }
        
        function parseShow( turtleCommand, turtleContext ) {
            turtle.style.display = "block";
            return 1;
        }

        function handleShow( turtleCommand, turtleContext ) {
            turtle.style.display = "block";
        }

        function clearMath( turtleContext ) {
            turtleContext.currentMath = 0.0;
            turtleContext.outputVariable = null;
        }

        function getDefinedCommand( what, turtleContext ) {
            return turtleContext.definedCommands[ what ];
        }

        function parseCommand( turtleCommand, turtleContext ) {
            var tokensEaten = 0;
            var tokenIter = turtleCommand;
            for( currentCommand = 0; currentCommand < turtleCommand.length; ) {
                var tokenIter = tokenIter.slice(tokensEaten);
                tokensEaten = 0;
                var commandToRun = getCommand( tokenIter[0] );
                if( commandToRun !== null ) {
                    tokensEaten = commandToRun.parser( tokenIter, turtleContext );
                    if( tokensEaten < 1 ) return null;
                    //rewrite original commands with modified bits.
                    for( var j = 0; j < tokensEaten; ++j ) {
                        turtleCommand[ currentCommand + j ] = tokenIter[ j ];
                    }
                    currentCommand += tokensEaten;
                    break;
                }

                if( tokensEaten == 0 ) {
                    let definedCommand = getDefinedCommand( tokenIter[0], turtleContext );
                    if( definedCommand !== undefined ) {
                        if( (tokenIter.length - 1) < definedCommand.vars.length ) {
                            setStatusMessage( "Defined command " + tokenIter[0] + " needs " + definedCommand.vars.length + " parameters." );
                            return null;
                        }
                        tokensEaten = definedCommand.vars.length + 1;
                        currentCommand += tokensEaten;
                        continue;
                    }
                }

                if( tokensEaten == 0 ) {
                    if( isAVariable( tokenIter[0] ) ) {
                        if( turtleContext.outputVariable !== null ) {
                            setStatusMessage("Trying to set " + tokenIter[0] + " when " + turtleContext.outputVariable + " is already set to be the output." );
                            return null;
                        }
                        tokensEaten = 1;
                        currentCommand += tokensEaten;
                        turtleContext.outputVariable = tokenIter[0];
                        continue;
                    }
                }
                
                if( tokensEaten == 0 ) {
                    setStatusMessage("I did not understand " + turtleCommand[currentCommand] );
                    clearMath( turtleContext );
                    return null;
                }
            }
            clearMath( turtleContext );
            return turtleCommand;
        }

        function applyCommands( turtleCommands, turtleContext ) {
            var tokensEaten = 0;
            var turtleIter = turtleCommands;
            for( currentCommand = 0; currentCommand < turtleCommands.length; ) {
                setVariable(":X", turtleContext.x, turtleContext );
                setVariable(":Y", turtleContext.y, turtleContext );
                setVariable(":ROT", turtleContext.rot, turtleContext );
                turtleIter = turtleIter.slice( tokensEaten );
                tokensEaten = 0;
                let commandToRun = getCommand( turtleIter[0] );
                if( commandToRun !== null ) {
                    if( verboseApply ) console.log("Running " + turtleIter[0]);
                    var tokensEaten = commandToRun.handler( turtleIter, turtleContext );
                    if( tokensEaten < 1 ) {
                        setStatusMessage("Runtime error at " + turtleCommands[ currentCommand ]);
                        return true;
                    }
                }
                let definedCommand = getDefinedCommand( turtleIter[0], turtleContext );
                if( tokensEaten == 0 && definedCommand !== undefined ) {
                    if( verboseApply ) console.log("Running Defined " + turtleIter[0]);
                    pushVariableContext( turtleContext );
                    for( let i = 0; i < definedCommand.vars.length; ++i ) {
                        setVariable( definedCommand.vars[i], turtleIter[ 1 + i ], turtleContext );
                    }
                    let innerCommands = definedCommand.commands;
                    for( let i = 0; i < innerCommands.length; ++i ) {
                        if( applyCommands( innerCommands[i], turtleContext ) ) {
                            popVariableContext( turtleContext );
                            return true;
                        }
                    }
                    popVariableContext( turtleContext );
                    tokensEaten = 1 + definedCommand.vars.length;
                }
                if( tokensEaten == 0 && isAVariable( turtleIter[0] ) ) {
                    if( verboseApply ) console.log("Output Variable: " + turtleIter[0]);
                    turtleContext.outputVariable = turtleIter[0];
                    tokensEaten = 1;
                }
                currentCommand += tokensEaten;
            }
            if( turtleContext.outputVariable !== null ) {
                if( verboseApply ) console.log("Setting " + turtleContext.outputVariable + " to " + turtleContext.currentMath );
                setVariable( turtleContext.outputVariable, turtleContext.currentMath, turtleContext );
            }
            clearMath( turtleContext );
            return false;
        }

        function grabTurtle(x,y) {
            if( turtle === null ) {
                let whmin = Math.min(x/10,y/10);
                let turtleWidth = Math.max( 30, whmin );
                let turtleHeight = Math.max( 30, whmin );
                whmin = Math.min(turtleWidth, turtleHeight);
                turtle = document.createElement("div");
                turtle.whmin = whmin;
                turtle.style.position="absolute";
                turtle.style.width=turtleWidth;
                turtle.style.height=turtleHeight;
                turtle.style.transformOrigin="center bottom";
                turtle.innerHTML=
                    svgStart( {width:turtleWidth,height:turtleHeight} ) +
                    '<path d="M0 ' + turtleHeight + ' L' + turtleWidth/2 + ' 0 ' + turtleWidth + ' ' + turtleHeight + ' Z" style="stroke:#ffffff;stroke-width:1;fill:#e0e0e0"/>' +
                    svgEnd();
            }
            return turtle;
        }

        function processCommand( command ) {
            let handled = false;
            let trimmedCommand = command.trim();
            let splits = command.split(" ");
            splits = splits.filter( (ell) => ell.length > 0 );

            let processedCommands = parseCommand( splits, globalTurtleState );

            handled = processedCommands != null;
            if( handled ) {
                if( commandAccumulator == null ) {
                    applyCommands( splits, globalTurtleState );
                    clearInputBox();
                } else {
                    commandAccumulator.push( processedCommands );
                    clearInputBox();
                }
            }
            return handled;
        }
        function parseSin( turtleCommand, turtleState ) {
            return 1;
        }
        function handleSin( turtleCommand, turtleState ) {
            turtleState.currentMath = Math.sin(turtleState.currentMath);
            return 1;
        }
        function parseCos( turtleCommand, turtleState ) {
            return 1;
        }
        function handleCos( turtleCommand, turtleState ) {
            turtleState.currentMath = Math.cos(turtleState.currentMath);
            return 1;
        }
        function parseTan( turtleCommand, turtleState ) {
            return 1;
        }
        function handleTan( turtleCommand, turtleState ) {
            turtleState.currentMath = Math.tan(turtleState.currentMath);
            return 1;
        }
        function parseSqrt( turtleCommand, turtleState ) {
            return 1;
        }
        function handleSqrt( turtleCommand, turtleState ) {
            turtleState.currentMath = Math.sqrt(turtleState.currentMath);
            return 1;
        }

        function parseAssign( turtleCommand, turtleState ) {
            if( parseNumberOrVariable( turtleCommand[1] ) == NaN ) {
                if( getCommand( turtleCommand[1] ) == null ) {
                    setStatusMessage( "= needs to be followed by a variable or number" );
                    return -1;
                }
                return 1;
            }
            return 2;
        }
        function handleAssign( turtleCommand, turtleState ) {
            turtleState.currentMath = handleNumberOrVariable( turtleCommand[1], turtleState );
            if( turtleState.currentMath == NaN ) {
                if( getCommand( turtleCommand[1] ) == null ) {
                    return -1;
                }
                return 1;
            }
            return 2;
        }

        function parseAddition( turtleCommand, turtleState ) {
            if( parseNumberOrVariable( turtleCommand[1] ) == NaN ) {
                setStatusMessage( "+ needs to be followed by a variable or number" );
                return -1;
            }
            return 2;
        }
        function handleAddition( turtleCommand, turtleState ) {
            let outputVal = handleNumberOrVariable( turtleCommand[1], turtleState );
            if( outputVal == NaN ) {
                return -1;
            }
            turtleState.currentMath += outputVal;
            return 2;
        }
        function parseSubtraction( turtleCommand, turtleState ) {
            if( parseNumberOrVariable( turtleCommand[1] ) == NaN ) {
                setStatusMessage( "- needs to be followed by a variable or number" );
                return -1;
            }
            return 2;
        }
        function handleSubtraction( turtleCommand, turtleState ) {
            let outputVal = handleNumberOrVariable( turtleCommand[1], turtleState );
            if( outputVal == NaN ) {
                return -1;
            }
            turtleState.currentMath -= outputVal;
            return 2;
        }
        function parseMultiply( turtleCommand, turtleState ) {
            if( parseNumberOrVariable( turtleCommand[1] ) == NaN ) {
                setStatusMessage( "* needs to be followed by a variable or number" );
                return -1;
            }
            return 2;
        }
        function handleMultiply( turtleCommand, turtleState ) {
            let outputVal = handleNumberOrVariable( turtleCommand[1], turtleState );
            if( outputVal == NaN ) {
                return -1;
            }
            turtleState.currentMath *= outputVal;
            return 2;
        }
        function parseDivide( turtleCommand, turtleState ) {
            if( parseNumberOrVariable( turtleCommand[1] ) == NaN ) {
                setStatusMessage( "/ needs to be followed by a variable or number" );
                return -1;
            }
            return 2;
        }
        function handleDivide( turtleCommand, turtleState ) {
            let outputVal = handleNumberOrVariable( turtleCommand[1], turtleState );
            if( outputVal == NaN ) {
                return -1;
            }
            if( outputVal === 0 ) {
                setStatusMessage("Divide by zero.");
                return -1;
            }
            turtleState.currentMath /= outputVal;
            return 2;
        }

        window.onload = function () {
            fillHelp();
            deleteLineFromAria();
        }
