<html>
<head>
    <title>audio</title>
    <meta charset="utf-8"></meta>
    <meta name="HandheldFriendly" content="true"></meta>
    <meta name="MobileOptimized" content="320"></meta>
    <meta name="viewport" content="initial-scale=1.0, width=device-width, user-scalable=no"></meta>
    <style>
/* http://meyerweb.com/eric/tools/css/reset/ 
   v2.0 | 20110126
   License: none (public domain)
*/
html, body, div, span, applet, object, iframe,
h1, h2, h3, h4, h5, h6, p, blockquote, pre,
a, abbr, acronym, address, big, cite, code,
del, dfn, em, img, ins, kbd, q, s, samp,
small, strike, strong, sub, sup, tt, var,
b, u, i, center,
dl, dt, dd, ol, ul, li,
fieldset, form, label, legend,
table, caption, tbody, tfoot, thead, tr, th, td,
article, aside, canvas, details, embed, 
figure, figcaption, footer, header, hgroup, 
menu, nav, output, ruby, section, summary,
time, mark, audio, video {
	margin: 0;
	padding: 0;
	border: 0;
	font-size: 100%;
	font: inherit;
	vertical-align: baseline;
}
/* HTML5 display-role reset for older browsers */
article, aside, details, figcaption, figure, 
footer, header, hgroup, menu, nav, section {
	display: block;
}
body {
	line-height: 1;
}
ol, ul {
	list-style: none;
}
blockquote, q {
	quotes: none;
}
blockquote:before, blockquote:after,
q:before, q:after {
	content: '';
	content: none;
}
table {
	border-collapse: collapse;
	border-spacing: 0;
}
/* Reset Ends */

html {
    align: center;
    align-content: center;
    background-color: #606060;
}
body,body#wholeBody,code,textarea {
    margin: 0px auto;
    padding: 0px;
    display: flex;
    flex-direction: column;
    font-family: 'Courier New', monospace;
    max-width:1024px;
    line-height:1.3;
    font-size:18px;
    color:#E0E0E0;
    width: 100%;
    background-color:#000000;
    color: #E0E0E0;
    overflow: hidden;
    scrollbar-color: #404040 #808080;
    scrollbar-width: thin;
}
body {
    min-height: 100dvh;
    max-height: 100dvh;
}
.scroll {
    overflow-y: scroll;
}
/*Where the scroll happens*/
.top-screen-part {
    min-height: 60dvh;
    max-height: 60dvh;
}
.over-keyboard {
    z-index: 2;
}
.keyboard-area {
    position: relative;
}
.keys-area {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    margin: 0;
}
.black-keys-area {
    height: 8dvh;
}
.key {
    float: left;
    width: calc( (95% / 52) - 2px );
    margin-left: 1;
    margin-right: 1;
    margin-top: 0;
    margin-bottom: 0;
}
.key-half {
    width: calc( ((95% / 52) - 2px) / 2 );
    height: 1;
}
.key-empty {
    height: 1;
}
.key-black {
    background: black;
    min-height: 8dvh;
    max-height: 8dvh;
}
.key-white {
    background: white;
    min-height: 12dvh;
    max-height: 12dvh;
}
.key-active {
    background: gray;
}

.outer-keyboard-area {
    position: relative;
    min-height: 20dvh;
    max-heigh: 20dvh;
    width: 100%;
    margin: 0;
}
/*Input area*/
.bottom-screen-part {
    min-height: 20dvh;
    max-height: 20dvh;
    display: flex;
    justify-content: flex-start;
    flex-direction: column;
}
.output-area {
    margin: auto;
    width: 95%;
    max-width: 95%;
    white-space: pre-wrap;
    word-wrap: break-word;
}
.input-area, .input-area:focus {
    width: calc(90% - 2em);
    min-width: calc(90% - 2em);
    height: 95%;
    min-height: 95%;
    outline: none; 
    white-space: pre-wrap;
    word-wrap: break-word;
}
.lowerpadded {
    padding-left: 2.5%;
    padding-right: 2.5%;
}
.input-area > div {
    float: left;
}
.statusbar {
    height: 1.5em;
    width: 95%;
    background-color: #707070;
    color: #000000;
    display: block;
    font-weight: bold;
}

.topright {
    position: absolute;
    top: 1.5em;
    right: 1em;
    width: 50px;
    height: 50px;
}

.bottomright {
    position: absolute;
    bottom: 0px;
    right: 1em;
    width: 50px;
    height: 50px;
}
a {
    color: #E0E0E0;
}
a:hover {
    color: #F0F0F0;
}
a:visited {
    color: #D8D8D8;
}
a:active {
    color: #FFFFFF;
}
.help {
    font-family: 'Arial', sans-serif;
    font-size: 16;
    margin: 20;
    position: absolute;
    display: block;
    color: #F0F0F0;
}
td {
}
.hidden {
    display: none;
}

</style>
</head>
<body id="wholeBody">
    <noscript>You're going to need javascript for any of this to work.</noscript>
    <div id="thehelp" class="hidden top-screen-part help scroll">
    </div>
    <div id="outputScrollDiv" class="top-screen-part scroll">
        <div class="output-area" id="outputDiv"></div>
    </div>
    <div id="outerKeyboardDiv" class="outer-keyboard-area">
    
    <div class="keys-area">
        <div id="whiteKeysDiv" class="keyboard-area">
        </div>
    </div>
    <div class="keys-area black-keys-area">
        <div id="blackKeysDiv" class="keyboard-area over-keyboard">
        </div>
    </div>
    </div>
    <div style="max-width:1;max-height:1;position:absolute;top=0;left=0;overflow:hidden" id="screenReaderElement" aria-live="polite"></div>
    <div style="position: relative" class="bottom-screen-part">
        <div id="lebar" class="statusbar lowerpadded">
            Welcome to audio. Type 'help' to get the help.
        </div>
        <div style="z-index: 50" class="scroll">
            <div contenteditable="true" class="input-area lowerpadded" id="inputBox" type="text" autofocus></div>
        </div>
        <div id="upbutton" class="topright" onclick="inputCacheUp()">
        <svg width="50" height="50" xmlns="http://www.w3.org/2000/svg">
   <path d="M5 45 L25 5 L45 45 L5 45" style="fill:#E0E0E0;stroke:#000000;stroke-width:5" stroke-linecap="round" />
</svg></div>
        <div id="downbutton" class="bottomright" onclick="inputCacheDown()">
        <svg width="50" height="50" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 5 L25 45 L45 5 L5 5" style="fill:#E0E0E0;stroke:#000000;stroke-width:5" stroke-linecap="round" />
</svg> </div>
    </div>
    <script>
        inputBox.innerText = "";

        var undoStack = [];
        var inputCache = [];
        var currentLineCache = null;
        var currentInputCacheIndex = 0;

        var commandAccumulatorName = null;
        var commandAccumulator = null;
        var commandVariables = null;

        var maxBackscroll = 300;

        var instrumentWave = "sine";

        function addLine( text ) {
            let newElement = document.createElement("div");
            newElement.textContent = text;
            outputDiv.appendChild( newElement );
            if( outputDiv.childElementCount > maxBackscroll )
                outputDiv.removeChild( outputDiv.firstChild );
                
            outputScrollDiv.scrollTop = outputDiv.scrollHeight;
        }

        function inputCacheUp() {
            if( inputCache.length < 1 ) return;
            if( currentInputCacheIndex == 0 ) {
                currentInputCacheIndex = 1;
                currentLineCache = inputBox.innerText;
            } else {
                currentInputCacheIndex++;
            }
            while( currentInputCacheIndex > inputCache.length ) {
                --currentInputCacheIndex;
            }
            inputBox.innerText = inputCache[ inputCache.length - currentInputCacheIndex ];
        }

        function inputCacheDown() {
            if( currentInputCacheIndex > 0 ) {
                --currentInputCacheIndex;
            }
            if( currentInputCacheIndex == 0 ) {
                if( currentLineCache !== null && currentLineCache !== undefined ) {
                    inputBox.innerText = currentLineCache;
                }
            } else {
                if( inputCache.length > 0 ) {
                    inputBox.innerText = inputCache[ inputCache.length - currentInputCacheIndex ];
                }
            }
        }

        function inputCacheReset() {
            currentInputCacheIndex = 0;
            currentLineCache = null;
        }

        function inputCachePush(atext) {
            inputCache.push(atext);
            if( inputCache.length > 100 )
                inputCache.shift();
        }

        //On any keypress...focus the input box
        wholeBody.addEventListener( "keydown", function (event) {
	    switch( event.key ) {
            case "ArrowUp":
                //back one
                inputCacheUp();
                break;
            case "ArrowDown":
                inputCacheDown();
                break;
            default:
                inputBox.focus();
                break;
            }
        } );

        inputBox.addEventListener( "touchstart", function (event) {
            inputBox.focus();
        } );

        inputBox.addEventListener( "keypress", function (event) {
            if( event.key == "Enter" ) {
                event.preventDefault();
                sendInputBox();
            } else {
                inputCacheReset();
            }
        });

        var clearStatusTimeout = undefined;
        function clearStatus() {
            if( clearStatusTimeout ) {
                clearTimeout( clearStatusTimeout );
            }

            clearStatusTimeout = undefined;
            lebar.innerText = "Welcome to audio. Enter 'help' for help.";
        }
        function setStatusMessage( text ) {
            if( clearStatusTimeout ) {
                clearTimeout( clearStatusTimeout );
            }
            setTimeout( clearStatus, 5000 );
            
            lebar.innerText = text;
        }
        function setStatusMessageIfNotSet( text ) {
            if( clearStatusTimeout ) return;
            setStatusMessage( text );
        }

        let scrollbackTimeout = 5000;

        function deleteLineFromAria() {
            try {
                if( screenReaderElement.firstChild )
                    screenReaderElement.removeChild( screenReaderElement.firstChild );
            }catch(e) {};
            setTimeout( deleteLineFromAria, scrollbackTimeout );
        }

        function sendInputBox() {
            let handled = false;
            let newElement = document.createElement("div");
            newElement.textContent = inputBox.innerText;
            inputCachePush( inputBox.innerText );
            screenReaderElement.appendChild( newElement );
            let allInputText = inputBox.innerText;
            let splitText = allInputText.split("\n");
            let len = splitText.length;
            for( let i = 0; i < len; ++i ) {
                if( !processCommand( splitText[i] ) ) {
                    break;
                }
            }
        }

        function clearInputBox() {
            inputBox.innerText = "";
        }

        var verboseApply = false;
        var rootParseState = {
            "definedCommands":{},
            "globalVariables":{":PI":3.141592654,":E":2.718281828459},
            "currentMath":0.0,
            "audioNodes":null,
            "audioContext":null,
            "variableStack":[]
        };

        var globalParseState = null;

        function xyFromContext(x,y,parseContext) {
            return {"x":Math.floor(Number(x)),"y":Math.floor(Number(parseContext.height)-Number(y))};
        }

        function getCommand( forThis ) {
            for( var i = 0; i < commands.length; ++i ) {
                if( forThis == commands[i].command ) {
                    return commands[i];
                }
            }
            return null;
        }

        function isAVariable( aString ) {
            if( aString === undefined ) return false;
            if( typeof aString != "string" ) return false;
            return aString.startsWith(":")
        }

        function parseNumberOrVariable( aString, turtleState ) {
            if( isAVariable( aString ) ) {
                return aString;
            }
            return Number(aString);
        }

        function setVariable(aVariable, aValue, parseState ) {
            if( !isAVariable( aVariable ) ) {
                return true;
            }
            if( parseState.variableStack.length > 0 ) {
                parseState.variableStack[parseState.variableStack.length - 1][ aVariable ] = handleNumberOrVariable(aValue, parseState);
            } else {
                parseState.globalVariables[ aVariable ] = handleNumberOrVariable( aValue, parseState );
            }
            return false;
        }

        var commands = [
            { "command":"wave", "handler":handleWave, "parser":parseWave, "helpcommand":"wave <shape>", "helpdesc":"Sets the default wave shape for the keyboard. One of 'sine' 'square' 'sawtooth' 'triangle'"},
            { "command":"keyboard", "handler":handleKeyboard, "parser":parseKeyboard, "helpcommand":"keyboard", "helpdesc":"Set up default keyboard instrument. Sine wave, single gain 'instrument' connected to the output node." },
            { "command":"list", "handler":handleList, "parser":parseList, "helpcommand":"list <node>", "helpdesc":"List the parameters we can set on the named node."},
            { "command":"delete", "handler":handleDelete, "parser":parseDelete, "helpcommand":"delete <node>", "helpdesc":"Deletes a tracked node." },
            { "command":"start", "handler":handleStart, "parser":parseStart, "helpcommand":"start <node>", "helpdesc":"Starts a node, like an osciallator."},
            { "command":"stop", "handler":handleStop, "parser":parseStop, "helpcommand":"stop <node>", "helpdesc":"Stops a node, like an oscillator." },
            { "command":"connect", "handler":handleConnect, "parser":parseConnect, "helpcommand":"connect <node> <node> [<node>....]", "helpdesc":"Connects nodes to other nodes, source->destination. Special node named 'output' is the final output." },
            { "command":"set", "handler":handleSet, "parser":parseSet, "helpcommand":"set <node> <parameter> <value>", "helpdesc":"Live sets the <parameter> on <node> with <value>" },
            { "command":"addsource", "handler":handleSource, "parser":parseSource, "helpcommand":"addsource [oscillator|wavfile] <name>", "helpdesc":"Creates a new audio source, either 'oscillator' or 'name of audio file' attached to <name>" },
            { "command":"create", "handler":handleAddNode, "parser":parseAddNode, "helpcommand":"create <nodeType> <nodeName>", "helpdesc":"Creates a new process node, types are 'gain' 'iir' 'periodic' shaper' 'compressor' 'delay' 'convolver' or 'biquad'" },
            { "command":"clear", "handler":handleClear, "parser":parseClear,"helpcommand":"clear","helpdesc":"Clears the global audio thing out." },
            { "command":"verboseapply", "handler":handleVerboseApply, "parser":parseVerboseApply, "helpcommand":"verboseapply", "helpdesc":"Turns on verbose logging of commands running in the console log of the browser."},
            { "command":"help", "handler":handleHelp, "parser":parseHelp, "helpcommand":"help", "helpdesc":"Brings up this help!" }
        ];

        function parseWave( parseCommands, parseState ) {
            if( parseCommands.length < 2 ) { 
                setStatusMessage("Command 'wave' needs 1 parameter.");
            }
            switch( parseCommands[1] ) {
                case "sine":
                case "triangle":
                case "square":
                case "sawtooth":
                    break;
                default:
                    setStatusMessage("Wave needs to be 'sine' 'triangle' 'square' or 'sawtooth'");
                    return -1;
            }
            return 2
        }
        function handleWave( parseCommands, parseState ) {
            instrumentWave = parseCommands[1];
            return 2;
        }
        function parseKeyboard( parseCommands, parseState ) {
            return 1;
        }

        function handleKeyboard( parseCommands, parseState ) {
            processCommand( "create gain instrument" );
            processCommand( "connect instrument output" );
            processCommand( "set instrument gain 0.2" );

            return 1;
        }
        

        function parseList( parseCommands, parseState ) {
            if( parseCommands.length < 2 ) {
                setStatusMessage("Command 'list <name>' needs a name parameter" );
                return -1;
            }
            return 2;
        }

        var typeToParameters = {
            "OscillatorNode":{"parameters":["frequency","type"],"type":["sine","square","sawtooth","triangle"]},
            "WaveShaperNode":{"parameters":["curve","oversample"]},
            "DelayNode":{"parameters":["delayTime"]},
            "ConvolverNode":{},
            "BiquadFilterNode":{"parameters":["frequency","detune","Q","gain","type"],"type":["lowpass","highpass","bandpass","lowshelf","highshelf","peaking","notch","allpass"]},
            "IIRFilterNode":{}
        };

        function findParameters( node ) {
            let typeName = node.constructor.name;
            return typeToParameters[typeName];
        }

        function handleList( parseCommands, parseState ) {
            let nodeToList = parseState.audioNodes[ parseCommands[ 1 ] ];
            if( nodeToList === undefined ) {
                setStatusMessage("Could not find node named " + parseCommands[1]);
                return -1;
            }
            
            let params = findParameters( nodeToList );
            if( params === undefined ) {
                setStatusMessage("Node is not a thing we can get the parameters for.");
                return -1;
            }

            let outLine = "";
            params.parameters.forEach( a => { outLine = "Parameter: " + a; let values = params[a]; if ( values ) { outLine += " validValues: "; values.forEach( v => { outLine += (" " + v)} ); }; addLine(outLine); } );
            
            return 2;
        }

        function parseDelete( parseCommands, parseState ) {
            if( parseCommands.length < 2 ) {
                setStatusMessage("Command 'delete <name>' needs a name parameter" );
                return -1;
            }
            return 2;
        }

        function handleDelete( parseCommands, parseState ) {
            let nodeToDelete = parseState.audioNodes[ parseCommands[ 1 ] ];
            if( nodeToDelete === undefined ) {
                setStatusMessage( "Could not find node " + parseCommands[1] );
                return -1;
            }
            parseState.audioNodes[ parseCommands[ 1 ] ] = undefined;
            return 2;
        }

        function privateHandleStartStop( parseCommands, parseState, start ) {
            let nodeToStart = parseState.audioNodes[ parseCommands[ 1 ] ];
            if( nodeToStart === undefined ) {
                setStatusMessage( "Could not find node " + parseCommands[1] );
                return -1;
            }
            try {
                if( start ) {
                    nodeToStart.start();
                } else {
                    nodeToStart.stop();
                    let freq = nodeToStart.frequency.value;
                    let type = nodeToStart.type;
                    nodeToStart = parseState.audioContext.createOscillator();
                    parseState.audioNodes[ parseCommands[1] ] = nodeToStart;
                    nodeToStart.frequency.value = freq;
                    nodeToStart.type.value = type;
                }
            } catch(e) {
                console.log(e);
                setStatusMessage("Start could not start node named " + parseCommands[1]);
                return -1;
            }
            return 2;
        }

        function parseStart( parseCommands, parseState ) {
            if( parseCommands.length < 2 ) {
                setStatusMessage( "start <node> needs a node name to start." );
                return -1;
            }
        }

        function handleStart( parseCommands, parseState ) {
            return privateHandleStartStop( parseCommands, parseState, true );
        }

        function parseStop( parseCommands, parseState ) {
            if( parseCommands.length < 2 ) {
                setStatusMessage( "<node> needs a node name to start." );
                return -1;
            }
        } 
        function handleStop( parseCommands, parseState ) {
            return privateHandleStartStop( parseCommands, parseState, false );
        }

        function parseSource( parseCommands, parseState ) {
            return -1;
        }
        function handleSource( parseCommands, parseState ) {
            return -1;
        }

        function parseConnect( parseCommands, parseState ) {
            return parseCommands.length;
        }

        function handleConnect( parseCommands, parseState ) {
            try {
                let baseNode = null;
                let nextNode = null;
                for( let i = 1; i < parseCommands.length; ++i ) {
                    nextNode = parseState.audioNodes[ parseCommands[i] ];
                    if( nextNode === undefined ) {
                        setStatusMessage("Could not find node named " + parseCommands[i]);
                    }
                    if( baseNode != null ) baseNode = baseNode.connect( nextNode );
                    baseNode = nextNode;
                }
            } catch(e) {
                setStatusMessage("Failed to connect nodes.");
                return -1;
            }
            return parseCommands.length;
        }


        function parseAddNode( parseCommands, parseState ) {
            if( parseCommands.length < 3 ) {
                setStatusMessage( "create <nodeType> <nodeName> requires 2 parameters." );
                return -1;
            }
            switch( parseCommands[1] ) {
                case "oscillator":
                    break;
                case "gain":
                    break;
                case "iir":
                    break;
                case "periodic":
                    break;
                case "shaper":
                    break;
                case "compressor":
                    break;
                case "delay":
                    break;
                case "convolver":
                    break;
                case "biquad":
                    break;
                default:
                    setStatusMessage("create <nodeType> <nodeName> nodeType incorrect. Check help.");
                    return -1;
            }
            if( parseState.audioNodes[ parseCommands[2] ] !== undefined ) {
                setStatusMessage("Node " + parseCommands[2] + " already exists.");
                return -1;
            }
            return 3

        }

        function handleAddNode( parseCommands, parseState ) {
            let newNode = null;
            switch( parseCommands[1] ) {
                case "oscillator":
                    newNode = parseState.audioContext.createOscillator();
                    break;
                case "gain":
                    newNode = parseState.audioContext.createGain();
                    break;
                case "iir":
                    let feedforward = [ 0.0002, 0.0004, 0.0002 ];
                    let feedback = [ 1.0, 1.0, 1.0 ];
                    newNode = parseState.audioContext.createIIRFilter( feedforward, feedback );
                    break;
                case "periodic":
                    newNode = parseState.audioContext.createPeriodicWave();
                    break;
                case "shaper":
                    newNode = parseState.audioContext.createWaveShaper();
                    break;
                case "compressor":
                    newNode = parseState.audioContext.createDynamicsCompressor();
                    break;
                case "delay":
                    newNode = parseState.audioContext.createDelay();
                    break;
                case "convolver":
                    newNode = parseState.audioContext.createConvolver();
                    break;
                case "biquad":
                    newNode = parseState.audioContext.createBiquadFilter();
                    break;
                default:
                    setStatusMessage("Runtime error, no node named " + parseCommands[1]);
                    return -1;
            }

            parseState.audioNodes[ parseCommands[2] ] = newNode;

            return 3;
        }

        function parseSet( parseCommands, parseContext ) {
            if( parseCommands.length < 4 ) {
                setStatusMessage("Command 'set <node> <parameter> <value>' needs at least 3 parameters" );
            }
            return 4;
        }

        function handleSet( parseCommands, parseContext ) {
            let theNode = parseContext.audioNodes[ parseCommands[1] ];
            if( theNode === undefined ) {
                setStatusMessage("Unknown audio node " + parseCommands[1]);
                return -1;
            }
            let theAudioParameter = theNode[ parseCommands[2] ];
            if( theAudioParameter === undefined ) {
                setStatusMessage("Node named " + parseCommands[1] + " does not have a parameter named " + parseCommands[2] );
                return -1;
            }
            try {
                if( typeof theAudioParameter == "string" ) {
                    theNode[ parseCommands[2] ] = parseCommands[3];
                } else {
                    theAudioParameter.setValueAtTime( parseCommands[3], parseContext.audioContext.currentTime );
                }
            } catch (e) {
                console.log(e);
                setStatusMessage("Node named " + parseCommands[1] + " tried to set " + parseCommands[2] + " to " + parseCommands[3] );
                return -1;
            }
            return 4;
        }

        function parseClear() {
            return 1;
        }

        function handleClear( parseCommand, parseContext ) {
            if( parseContext.audioContext !== null ) {
                parseContext.audioContext.close();
            }
            resetParseState();
            return 1;
        }

        function fillHelp() {
            thehelp.innerHTML = "";
            let table = document.createElement("table");
            thehelp.appendChild(table);
            let tableRow = document.createElement("tr");
            table.appendChild(tableRow);
            let tableH = document.createElement("th");
            tableH.textContent = "Command";
            tableRow.appendChild(tableH);
            tableH = document.createElement("th");
            tableH.innerHTML = "<nbsp/>|<nbsp/>";
            tableRow.appendChild(tableH);
            tableH = document.createElement("th");
            tableH.textContent = "";
            tableRow.appendChild(tableH);
            for( let i = 0; i < commands.length; ++i ) {
                tableRow = document.createElement("tr");
                table.appendChild( tableRow );
                let tableD = document.createElement("td");
                tableD.textContent = commands[i].helpcommand;
                tableRow.appendChild(tableD);
                tableD = document.createElement("td");
                tableD.innerHTML = "<nbsp/>|<nbsp/>";
                tableRow.appendChild(tableD);
                tableD = document.createElement("td");
                tableD.textContent = commands[i].helpdesc;
                tableRow.appendChild(tableD);
            }
        }

        function parseHelp( parseCommand, parseContext ) {
            return 1;
        }
        function handleHelp( parseCommand, parseContext ) {
            thehelp.classList.toggle("hidden");
            return 1;
        }

        function handleSave( parseCommand, parseContext ) {
            let b = new Blob(["THING"], {type:"text/plain"});
            let url = URL.createObjectURL(b);
            let a = document.createElement("a");
            let filename = parseCommand[1];
            if( !filename.endsWith(".svg") ) filename = filename + ".svg"
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
        function parseVerboseApply( parseCommand, parseContext ) {
            return 1;
        }
        function handleVerboseApply( parseCommand, parseContext ) {
            verboseApply = !verboseApply;
            return 1;
        }

        function getDefinedCommand( what, parseContext ) {
            return parseContext.definedCommands[ what ];
        }

        function parseCommand( parseCommand, parseContext ) {
            var tokensEaten = 0;
            var tokenIter = parseCommand;
            for( currentCommand = 0; currentCommand < parseCommand.length; ) {
                var tokenIter = tokenIter.slice(tokensEaten);
                tokensEaten = 0;
                var commandToRun = getCommand( tokenIter[0] );
                if( commandToRun !== null ) {
                    tokensEaten = commandToRun.parser( tokenIter, parseContext );
                    if( tokensEaten < 1 ) return null;
                    //rewrite original commands with modified bits.
                    for( var j = 0; j < tokensEaten; ++j ) {
                        parseCommand[ currentCommand + j ] = tokenIter[ j ];
                    }
                    currentCommand += tokensEaten;
                    break;
                }

                if( tokensEaten == 0 ) {
                    let definedCommand = getDefinedCommand( tokenIter[0], parseContext );
                    if( definedCommand !== undefined ) {
                        if( (tokenIter.length - 1) < definedCommand.vars.length ) {
                            setStatusMessage( "Defined command " + tokenIter[0] + " needs " + definedCommand.vars.length + " parameters." );
                            return null;
                        }
                        tokensEaten = definedCommand.vars.length + 1;
                        currentCommand += tokensEaten;
                        continue;
                    }
                }

                if( tokensEaten == 0 ) {
                    setStatusMessage("I did not understand " + parseCommand[currentCommand] );
                    return null;
                }
            }
            return parseCommand;
        }

        function applyCommands( parseCommands, parseContext ) {
            var tokensEaten = 0;
            var parseIter = parseCommands;
            for( currentCommand = 0; currentCommand < parseCommands.length; ) {
                parseIter = parseIter.slice( tokensEaten );
                tokensEaten = 0;
                let commandToRun = getCommand( parseIter[0] );
                if( commandToRun !== null ) {
                    if( verboseApply ) console.log("Running " + parseIter[0]);
                    var tokensEaten = commandToRun.handler( parseIter, parseContext );
                    if( tokensEaten < 1 ) {
                        setStatusMessageIfNotSet("Runtime error at " + parseCommands[ currentCommand ]);
                        return true;
                    }
                }
                let definedCommand = getDefinedCommand( parseIter[0], parseContext );
                if( tokensEaten == 0 && definedCommand !== undefined ) {
                    if( verboseApply ) console.log("Running Defined " + parseIter[0]);
                    for( let i = 0; i < definedCommand.vars.length; ++i ) {
                        setVariable( definedCommand.vars[i], parseIter[ 1 + i ], parseContext );
                    }
                    let innerCommands = definedCommand.commands;
                    for( let i = 0; i < innerCommands.length; ++i ) {
                        if( applyCommands( innerCommands[i], parseContext ) ) {
                            return true;
                        }
                    }
                    tokensEaten = 1 + definedCommand.vars.length;
                }
                if( tokensEaten == 0 && isAVariable( parseIter[0] ) ) {
                    if( verboseApply ) console.log("Output Variable: " + parseIter[0]);
                    parseContext.outputVariable = parseIter[0];
                    tokensEaten = 1;
                }
                currentCommand += tokensEaten;
            }
            if( parseContext.outputVariable !== null ) {
                if( verboseApply ) console.log("Setting " + parseContext.outputVariable + " to " + parseContext.currentMath );
                setVariable( parseContext.outputVariable, parseContext.currentMath, parseContext );
            }
            return false;
        }

        function processCommand( command ) {
            let handled = false;
            let trimmedCommand = command.trim();
            let splits = command.split( " " );
            splits = splits.filter( (ell) => ell.length > 0 );

            let processedCommands = parseCommand( splits, globalParseState );

            handled = processedCommands != null;
            if( handled ) {
                if( commandAccumulator == null ) {
                    applyCommands( splits, globalParseState );
                    clearInputBox();
                } else {
                    commandAccumulator.push( processedCommands );
                    clearInputBox();
                }
            }
            return handled;
        }

        function resetParseState() {
            globalParseState = structuredClone(rootParseState);
            globalParseState.audioContext = new AudioContext();
            globalParseState.audioNodes = {};
            globalParseState.audioNodes[ "output" ] = globalParseState.audioContext.destination;
        }

        function noteKeyDown(evt) {
            let key = evt.target;
            if( key.osc ) return;
            key.osc = globalParseState.audioContext.createOscillator();
            key.osc.type = instrumentWave;
            key.osc.frequency.setValueAtTime( key.hz, globalParseState.audioContext.currentTime );
            key.osc.start();
            key.osc.connect( globalParseState.audioNodes[ "instrument" ] );
            key.classList.add("key-active");
        }
        function noteKeyEnter(evt) {
            if( evt.buttons == 1 ) noteKeyDown(evt);
        }
        function noteKeyLeave(evt) {
            noteKeyUp(evt);
        }
        function noteKeyUp(evt) {
            if( evt.target.osc ) evt.target.osc.stop();
            evt.target.osc = undefined;
            evt.target.classList.remove("key-active");
        }

        function noteFromBase( baseHz, noteInScale ) {
            const twoToThe12thRoot = 1.0594631;
            let outputHz = baseHz;
            for( let i = 0; i < noteInScale; ++i ) {
                outputHz *= twoToThe12thRoot;
            }
            return outputHz;
        }

        function keyDiv( blackWhiteOrEmpty ) {
            aKey = document.createElement("div");
            aKey.classList.add( "key", blackWhiteOrEmpty );
            aKey.onmousedown = noteKeyDown;
            aKey.onmouseup = noteKeyUp;
            aKey.onmouseleave = noteKeyLeave;
            aKey.onmouseenter = noteKeyEnter;
            aKey.addEventListener("dragstart",(evt)=>{event.preventDefault();});
            return aKey;
        }

        function printInstrument() {
            //Start with the instrument node.
            
        }

        function buildKeyboard() {
            var noteKeys = "ABCDEFG";
            var noteWithSharps = "A0CD0FG";
            const numNoteKeys = 7;
            const numWhiteKeys = 52;
            let currentOctave = 0;
            let startHz = 55;
            let aKey = document.createElement("div");
            aKey.classList.add("key", "key-half");
            blackKeysDiv.appendChild(aKey);
            let whichNote = 0;
            for( let i = 0; i < numWhiteKeys; ++i ) {
                aKey = keyDiv( "key-white" );
                aKey.keyName = noteKeys[i%numNoteKeys];
                aKey.hz = noteFromBase( startHz, whichNote );
                aKey.keyNum = whichNote;
                ++whichNote;
                whiteKeysDiv.appendChild( aKey );
                aKey = document.createElement("div");
                let keyName = noteWithSharps[i%numNoteKeys];
                if( i == (numWhiteKeys - 1) ) {
                    aKey = keyDiv("key-half");
                } else if( keyName == "0" ) {
                    aKey = keyDiv( "key-empty" );
                } else {
                    aKey = keyDiv( "key-black" );
                    aKey.keyName = keyName + "#";
                    aKey.hz = noteFromBase( startHz, whichNote );
                    aKey.keyNum = whichNote;
                    ++whichNote;
                }
                if( whichNote == 12 ) {
                    whichNote = 0;
                    startHz = startHz * 2;
                }
                blackKeysDiv.appendChild( aKey );
            }
        }

        window.onload = function () {
            buildKeyboard();
            fillHelp();
            deleteLineFromAria();
            resetParseState();
        }
    </script>
